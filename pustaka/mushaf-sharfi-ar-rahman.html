<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Mushaf Sharfi Ar-Rahman</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Amiri:wght@400;700&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
/* Layout: kolom baca mushaf di kiri, panel bedah sharaf menempel di kanan; di ponsel panel menjadi lembar bawah. */
:root{
  --bg:#f1f5f2; --surface:#ffffff; --ink:#13201a; --muted:#56675e; --line:#d2dcd5;
  --accent:#0d6a4f; --accent-soft:#dcefe6; --accent-ink:#ffffff;
  --warn:#9a5600; --warn-soft:#fff1d9;
  --c0:#c92a2a; --c1:#b121c4; --c2:#1f43e0; --c3:#16902f; --c4:#d97400; --c5:#7d1a1a; --c6:#1a1f1c; --c7:#0a8aa6;
  --c8:#8e24d8; --c9:#e0309f; --c10:#7ea800; --c11:#c25b8a; --c12:#6c8aa8; --c13:#9b7d6a; --c14:#a88b00; --c15:#758d14;
  --ui:'Source Sans 3',system-ui,-apple-system,'Segoe UI',sans-serif;
  --quran:'Amiri Quran','Scheherazade New','Noto Naskh Arabic',serif;
  --ar:'Amiri','Noto Naskh Arabic','Scheherazade New',serif;
  --shadow:0 6px 24px rgba(10,30,20,.12);
  --rule:#b59a52; --num:#6b5418;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1612; --surface:#16211c; --ink:#e6eee9; --muted:#9bada3; --line:#2a3b33;
    --accent:#4cc79a; --accent-soft:#1d3a2f; --accent-ink:#06150e;
    --warn:#ffb454; --warn-soft:#3a2a10;
    --c0:#ff7070; --c1:#e585f2; --c2:#7d97ff; --c3:#52d672; --c4:#ffa733; --c5:#cf8470; --c6:#e9efeb; --c7:#44d4ee; --c8:#c58cff; --c9:#ff5ccb; --c10:#b4e04a; --c11:#f7a8c4; --c12:#8fb0d0; --c13:#c4a690; --c14:#e0c040; --c15:#a4d03c;
    --shadow:0 6px 24px rgba(0,0,0,.5);
    --rule:#7d6a35; --num:#e0c77e;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1612; --surface:#16211c; --ink:#e6eee9; --muted:#9bada3; --line:#2a3b33;
  --accent:#4cc79a; --accent-soft:#1d3a2f; --accent-ink:#06150e;
  --warn:#ffb454; --warn-soft:#3a2a10;
  --c0:#ff7070; --c1:#e585f2; --c2:#7d97ff; --c3:#52d672; --c4:#ffa733; --c5:#cf8470; --c6:#e9efeb; --c7:#44d4ee; --c8:#c58cff; --c9:#ff5ccb; --c10:#b4e04a; --c11:#f7a8c4; --c12:#8fb0d0; --c13:#c4a690; --c14:#e0c040; --c15:#a4d03c;
  --shadow:0 6px 24px rgba(0,0,0,.5);
    --rule:#7d6a35; --num:#e0c77e;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:15px;line-height:1.5;margin:0}
.wrap{max-width:1280px;margin:0 auto;padding-block:18px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ar{font-family:var(--ar)}
header.top{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between;padding-bottom:14px;border-bottom:1px solid var(--line)}
header.top h1{margin:0;font-size:1.55rem;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
header.top p{margin:2px 0 0;color:var(--muted)}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:var(--surface);padding:7px 14px;border-radius:8px;font-weight:600;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.bar{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;margin:14px 0 8px}
.field{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:0 10px;min-width:0}
.field input{border:0;background:transparent;padding:8px 0;min-width:0;width:11rem;outline:0}
.field:focus-within{border-color:var(--accent)}
.field label{color:var(--muted);font-size:.85rem;white-space:nowrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:7px 12px;color:var(--muted);font-weight:600}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.lg{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 11px 4px 9px;font-size:.88rem}
.lg i{width:11px;height:11px;border-radius:50%;background:currentColor;display:inline-block}
.lg[aria-pressed="true"]{border-color:currentColor;box-shadow:inset 0 0 0 1px currentColor}
.lg span{color:var(--ink)}
.lg small{color:var(--muted);font-variant-numeric:tabular-nums}
.c0{color:var(--c0)}.c1{color:var(--c1)}.c2{color:var(--c2)}.c3{color:var(--c3)}.c4{color:var(--c4)}.c5{color:var(--c5)}.c6{color:var(--c6)}.c7{color:var(--c7)}.c8{color:var(--c8)}.c9{color:var(--c9)}.c10{color:var(--c10)}.c11{color:var(--c11)}.c12{color:var(--c12)}.c13{color:var(--c13)}.c14{color:var(--c14)}.c15{color:var(--c15)}
.layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(330px,430px);gap:20px;align-items:start}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px}
.pagewrap{display:flex;flex-direction:column;gap:10px;min-width:0}
.pnav{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.pnav .mid{display:flex;align-items:center;gap:8px;color:var(--muted);font-variant-numeric:tabular-nums;flex-wrap:wrap}
.pnav select{width:auto}
.field select{border:0;background:transparent;padding:6px 0;outline:0;color:var(--ink)}
.mushaf{padding:10px;container-type:inline-size;border-color:var(--rule)}
@media (max-width:700px){.mushaf{overflow-x:auto;-webkit-overflow-scrolling:touch}.frame{min-width:520px}}
.frame{border:2px solid var(--rule);outline:1px solid var(--rule);outline-offset:3px;padding:clamp(8px,2.4cqi,22px) clamp(8px,2.6cqi,26px);margin:4px}
.ln{display:flex;flex-wrap:nowrap;justify-content:space-between;align-items:baseline;direction:rtl;font-family:var(--quran);font-size:clamp(15px,3.6cqi,30px);line-height:2.15;column-gap:.18em;white-space:nowrap}
.ln.short{justify-content:center;column-gap:.5em}
.sh{direction:rtl;text-align:center;font-family:var(--ar);font-size:clamp(17px,3.6cqi,28px);color:var(--num);border:1.5px solid var(--rule);border-radius:4px;margin:.25em 8%;padding:.05em 0;line-height:1.9}
.bsm{color:var(--ink)}
.pfoot{display:flex;justify-content:space-between;color:var(--num);font-family:var(--ar);font-size:.95rem;padding:2px 8px 0;direction:rtl}
.w.flash{animation:fl 1.6s ease-out 1}
@keyframes fl{0%{box-shadow:0 0 0 4px var(--warn)}100%{box-shadow:0 0 0 0 transparent}}
.w{cursor:pointer;border-radius:6px;padding:0 1px;transition:background .12s}
.w:hover{background:var(--accent-soft)}
.w.sel{background:var(--accent-soft);box-shadow:0 0 0 2px var(--accent)}
.w.hit{background:var(--warn-soft);box-shadow:0 0 0 1px var(--warn)}
.show-qx .w.qx{border-bottom:3px dotted var(--accent)}
.qd.ex{border-color:var(--accent)}.qd.ex>summary b{color:var(--accent)}
.dim .w:not(.on){opacity:.16}
.num{display:inline-flex;align-items:center;justify-content:center;min-width:1.55em;height:1.55em;padding:0 .15em;border:1.5px solid var(--num);border-radius:50%;font-family:var(--ar);font-size:.56em;line-height:1;color:var(--num);vertical-align:.2em}
.panel{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);max-height:calc(100vh - 24px - env(safe-area-inset-top,0px));overflow:auto;padding:0}
.panel .empty{padding:22px;color:var(--muted)}
.panel .empty b{color:var(--ink)}
.ph{padding:16px 18px 12px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.ph .big{font-family:var(--quran);font-size:2.5rem;line-height:1.7;text-align:center;direction:rtl}
.close{display:none;position:absolute;top:8px;right:10px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:2px 10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:6px;padding:2px 8px;font-size:.85rem;background:var(--surface)}
.chip.cc{border-color:currentColor}
.chip .ar{font-size:1.05rem;line-height:1.3}
.sec{padding:14px 18px;border-bottom:1px solid var(--line)}
.sec:last-child{border-bottom:0}
.sec h3{margin:0 0 8px;font-size:.78rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
dl.kv{margin:0;display:grid;grid-template-columns:auto 1fr;gap:5px 14px}
dl.kv dt{color:var(--muted)}
dl.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.note{background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:8px 10px;font-size:.9rem;margin-top:6px}
.segs{display:flex;flex-direction:column;gap:5px}
.segrow{display:grid;grid-template-columns:4.2em 1fr;gap:10px;align-items:center}
.segrow .ar{font-family:var(--quran);font-size:1.55rem;direction:rtl;text-align:center;line-height:1.6}
.segrow span.t{color:var(--muted);font-size:.88rem}
.scope{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.lem{border:1px solid var(--line);border-radius:8px;margin-bottom:10px;overflow:hidden}
.lem>.lh{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline;padding:8px 12px;background:var(--accent-soft)}
.lem>.lh .ar{font-family:var(--quran);font-size:1.45rem;line-height:1.5}
.lem>.lh small{color:var(--muted)}
.lem.me{border-color:var(--accent)}
.der{display:flex;flex-wrap:wrap;gap:5px;padding:8px 12px;border-bottom:1px solid var(--line)}
.der .dchip{display:inline-flex;gap:6px;align-items:baseline;border-radius:6px;padding:1px 8px;font-size:.84rem;border:1px solid var(--line)}
.der .dchip .ar{font-size:1rem}
.der .yes{border-color:var(--accent);background:var(--accent-soft)}
.der .no{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1px}
details{border-top:1px solid var(--line)}
details:first-of-type{border-top:0}
details>summary{cursor:pointer;padding:7px 12px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
details>summary .ar{font-size:1.05rem}
details>summary .n{margin-inline-start:auto;color:var(--muted);font-variant-numeric:tabular-nums}
details .inner{padding:2px 12px 8px 22px}
details details{border-top:1px dashed var(--line)}
.loc{display:flex;gap:6px 8px;flex-wrap:wrap;padding:3px 0;font-size:.9rem}
.loc b{font-weight:600;white-space:nowrap}
.loc b .ar{font-size:1rem}
.loc .ay{display:flex;flex-wrap:wrap;gap:2px 6px;min-width:0}
.loc button.g{border:0;background:transparent;color:var(--accent);padding:0;text-decoration:underline;font-variant-numeric:tabular-nums}
.loc span.p{color:var(--ink);font-variant-numeric:tabular-nums}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.tile{padding:12px 14px}
.tile b{display:block;font-size:1.6rem;font-variant-numeric:tabular-nums;line-height:1.2}
.tile span{color:var(--muted);font-size:.88rem}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.bars{padding:14px 16px;display:flex;flex-direction:column;gap:7px}
.bars h2,.tbl h2{margin:0 0 6px;font-size:1rem}
.brow{display:grid;grid-template-columns:8.5em minmax(0,1fr) 5.5em;gap:10px;align-items:center;font-size:.92rem}
.brow .track{background:var(--bg);border-radius:4px;height:14px;overflow:hidden}
.brow .fill{height:100%;background:currentColor;border-radius:4px}
.brow .v{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.tblwrap{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
td.num2,th.num2{text-align:right;font-variant-numeric:tabular-nums}
td .ar{font-family:var(--quran);font-size:1.3rem;line-height:1.6}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--accent-soft)}
.tbl{padding:14px 16px}
.hint{color:var(--muted);font-size:.9rem;margin:0 0 10px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px;font-weight:600}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.check{display:inline-flex;gap:7px;align-items:center;color:var(--muted)}

.w.ed{border-bottom:3px solid var(--accent)}
.editor{padding:14px 18px;border-bottom:1px solid var(--line);background:var(--accent-soft)}
.editor h3{margin:0 0 10px;font-size:.78rem;letter-spacing:.07em;text-transform:uppercase;color:var(--accent)}
.fld{display:flex;flex-direction:column;gap:4px;margin-bottom:10px;min-width:0}
.fld>label{font-size:.85rem;color:var(--muted)}
.fld input[type=text],.fld select,.fld textarea,select.mini{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 9px;min-width:0;width:100%}
select.mini{width:auto;max-width:11rem}
.fld textarea{min-height:4.6rem;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.picks{display:flex;flex-wrap:wrap;gap:6px}
.pick{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 11px}
.pick i{width:10px;height:10px;border-radius:50%;background:currentColor;display:inline-block}
.pick span{color:var(--ink);font-weight:600}
.pick[aria-pressed="true"]{border-color:currentColor;box-shadow:inset 0 0 0 1px currentColor}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.badge-ok{color:var(--accent);font-weight:600;border-color:var(--accent)}
.msg{color:var(--accent);font-size:.9rem}
.btn.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.sm{padding:3px 9px;font-size:.85rem}
[hidden]{display:none!important}
@media (max-width:900px){
  .layout{grid-template-columns:minmax(0,1fr)}
  .panel{position:fixed;left:0;right:0;bottom:0;top:auto;max-height:68vh;border-radius:14px 14px 0 0;box-shadow:var(--shadow);z-index:20;padding-bottom:env(safe-area-inset-bottom,0px);transform:translateY(105%);transition:transform .2s}
  .panel.open{transform:none}
  .close{display:block}
  .brow{grid-template-columns:7em minmax(0,1fr) 4.6em}
}
.qd{border:1px solid var(--line);border-radius:8px;margin-bottom:8px;background:var(--surface)}
.qd>summary{padding:7px 10px;display:flex;flex-wrap:wrap;gap:2px 8px;align-items:baseline}
.qd>summary b{color:var(--accent)}
.qd .why{color:var(--muted);font-size:.85rem}
.qd .qb{padding:2px 12px 10px;font-size:.92rem}
.qd .qb ul{margin:4px 0 0;padding-left:1.1rem}.qd .qb li{margin:3px 0}
.qd .qb .ar{font-family:var(--ar);font-size:1.15em;direction:rtl;unicode-bidi:isolate}
.qlink{display:inline-block;margin-top:4px;color:var(--accent)}
@media (prefers-reduced-motion:reduce){.panel{transition:none}.w{transition:none}.w.flash{animation:none}}
</style>

<div class="wrap">
  <header class="top">
    <div>
      <h1>Mushaf Sharfi · Surah Ar-Raḥmān</h1>
      <p id="sub"></p>
    </div>
    <div class="tabs" role="tablist" aria-label="Tampilan">
      <button class="tab" role="tab" id="tab-baca" aria-selected="true" data-tab="baca">Baca</button>
      <button class="tab" role="tab" id="tab-stat" aria-selected="false" data-tab="stat">Statistik</button>
      <button class="tab" role="tab" id="tab-rev" aria-selected="false" data-tab="rev">Muraja'ah</button>
      <button class="tab" role="tab" id="tab-edit" aria-selected="false" data-tab="edit">Edit</button>
    </div>
  </header>

  <section id="v-baca">
    <div class="bar">
      <div class="field"><label for="q">Cari akar</label><input id="q" type="search" dir="rtl" lang="ar" placeholder="مثال: كفر" autocomplete="off" class="ar"></div>
      <div class="field"><label for="jsur">Surah</label><select id="jsur"><option value="55">Ar-Raḥmān</option></select></div>
      <div class="field"><label for="jump">Ayat</label><input id="jump" type="number" min="1" max="78" inputmode="numeric" placeholder="1–78" style="width:5.5rem"></div>
      <div class="seg" role="group" aria-label="Sumber warna">
        <button id="m-edit" aria-pressed="true" title="Warna Abi dengan musytaq dirinci, ditambah semua edit tersimpan">Hasil edit</button>
        <button id="m-abi" aria-pressed="false" title="Warna asli dari file mushaf Abi (8 kategori), tanpa edit">Warna asli</button>
      </div>
      <button class="btn" id="edtog" aria-pressed="false" hidden>Mode edit</button>
      
      <span id="qinfo" class="hint" style="margin:0"></span>
      <button class="btn sm" id="qprev" hidden aria-label="Hasil sebelumnya">‹</button><button class="btn sm" id="qnext" hidden aria-label="Hasil berikutnya">›</button>
    </div>
    <div class="legend" id="legend" role="group" aria-label="Saring menurut kategori"></div>
    <div class="layout">
      <div class="pagewrap">
        <div class="pnav">
          <button class="btn" id="pnext">‹ Halaman berikut</button>
          <div class="mid"><label for="psel">Halaman</label><select id="psel" class="btn"></select><span id="pinfo"></span></div>
          <button class="btn" id="pprev">Halaman sebelum ›</button>
        </div>
        <div class="card mushaf" id="mushaf" lang="ar"><div class="frame" id="page"></div><div class="pfoot"><span id="pf-r"></span><span id="pf-m"></span><span id="pf-l"></span></div></div>
      </div>
      <aside class="card panel" id="panel" aria-live="polite"></aside>
    </div>
  </section>

  <section id="v-stat" hidden></section>
  <section id="v-rev" hidden></section>

,4]]},{"t":"t","i":[["n",65],[66,1],[66,2],[66,3],["n",66],[67,1],[67,2],[67,3],[67,4],["n",67]]},{"t":"t","i":[[68,1],[68,2],[68,3],[68,4],["n",68],[69,1],[69,2],[69,3],[69,4],["n",69]]}],[{"t":"t","i":[[70,1],[70,2],[70,3],["n",70],[71,1],[71,2],[71,3],[71,4]]},{"t":"t","i":[["n",71],[72,1],[72,2],[72,3],[72,4],["n",72],[73,1],[73,2],[73,3]]},{"t":"t","i":[[73,4],["n",73],[74,1],[74,2],[74,3],[74,4],[74,5],[74,6],["n",74],[75,1]]},{"t":"t","i":[[75,2],[75,3],[75,4],["n",75],[76,1],[76,2],[76,3],[76,4]]},{"t":"t","i":[[76,5],[76,6],["n",76],[77,1],[77,2],[77,3],[77,4],["n",77]]},{"t":"t","i":[[78,1],[78,2],[78,3],[78,4],[78,5],[78,6],["n",78]]}]],"qd":{"1":{"t":"Nahwu dan Shorof","p":"Halaman 7 – 11","s":["Shorof = Membaca bangunan kalimah (huruf awal s.d. sebelum akhir) -> memahami makna kata (mufrodat).","Nahwu = Membaca akhir kalimah saat digabung dengan kalimah lain -> memahami makna kalimat (jumlah/tarkib).","Objek Shorof = Kalimah mutasharrif (kalimah yang bisa berubah bentuknya, baik fi'il maupun isim).","9 Shighah Dasar: Fi'il Madhi, Mudhari', Amar, Nahyi, Mashdar, Isim Fa'il, Isim Maf'ul, Isim Zaman/Makan, Isim Alat."],"j":1},"2":{"t":"Langkah Membaca Kalimah","p":"Halaman 4 & 7","s":["Langkah 1: Identifikasi Kalimah (Isim, Fi'il, dan Harf).","Langkah 2: Mengetahui jenis kalimah yang terletak sebelum kalimah yang akan dibaca.","Langkah 3: Mengetahui perubahan akhir kalimah (I'rob).","Langkah 4: Mengetahui jabatan kalimah dalam kalimat.","Langkah 5: Mengetahui makna kalimah dengan merujuk pada Kamus dan Kaidah Tashrif."],"j":1},"3":{"t":"Kalimah dan Jumlah. Kalimah = Isim, Fi’il dan Harf","p":"Halaman 2 – 3, 5 – 6, & 12 – 14","s":["Rumus: الكَلِمَةُ + الكَلِمَةُ = الجُمْلَةُ (contoh: مُحَمَّدٌ + قَائِمٌ = مُحَمَّدٌ قَائِمٌ).","4 Aspek Pembahasan Kalimah (Hal. 12): التَّعْرِيفُ (Definisi), العَلَامَةُ (Tanda), الصِّيغَةُ (Bentuk), الأَقْسَامُ (Pembagian).","Isim dominan dengan tandanya; Fi'il & Harf dominan dengan bentuknya.","Isim & Fi'il memiliki makna mandiri; Harf tidak mandiri kecuali digabung dengan Isim/Fi'il."],"j":1},"4":{"t":"Kalimah Haraf = Amilah dan Athilah","p":"Halaman 15 – 16","s":["Harf 'Athilah (3): Lam Ibtida' (pada Isim), La Nafyi (pada Fi'il), Harf Istifham أ/هل (pada Isim & Fi'il).","Harf 'Amilah pada Isim (5): Harf Jar, Harf Nashab, Harf Nafi, Harf Nida, Harf Istitsna.","Harf 'Amilah pada Fi'il (2): 'Amil Nashib dan 'Amil Jazim.","Harf 'Amilah pada Isim & Fi'il (1): Harf 'Athaf."],"j":1},"5":{"t":"Kalimah Isim Definisi dan Tanda","p":"Halaman 14 & 17 – 19","s":["Definisi Isim: Bermakna benda/nama, mandiri maknanya, tidak terikat waktu.","8 Tanda Isim: (1) Ma-Mi-Mu, (2) Al-, (3) Tanwin, (4) Ta' Marbuthah, (5) Harf Jar, (6) Harf Nida, (7) Harf Nashab, (8) Idhafah.","Senandung Bahar Rajaz memudahkan hafalan ke-8 tanda Isim."],"j":1},"6":{"t":"Kalimah Fi’il Definisi, Pembagian dan tanda","p":"Halaman 14, 20 – 22, 25 – 26","s":["4 Pembagian Fi'il: Fi'il Madhi (lampau), Fi'il Mudhari' (sedang/akan datang), Fi'il Amar (perintah), Fi'il Nahyi (larangan).","3 Tanda Fi'il Madhi: Diakhiri Ta' Fa'il, didahului Qad/Laqad, diakhiri Ta' Ta'nits Sukun.","6 Tanda Fi'il Mudhari': Diawali huruf ANITA (أ، ن، ي، ت), didahului Lam, Alam, Qad, Sa-, dan Saufa.","Fi'il Shahih (Salim, Mahmuz, Mudha'af) vs Fi'il Mu'tal (Mitsal, Ajwaf, Naqish, Lafif)."],"j":1},"7":{"t":"Wazan kalimah Fi’il dan Tashrif Fi’il ( mengubah dari Madhi menjadi -> Mudhari dan Amar )","p":"Halaman 23 – 63, 128 – 130","s":["Wazan menggunakan 3 huruf dasar: ف (Fa' Fi'il), ع ('Ain Fi'il), dan ل (Lam Fi'il).","6 Bab Tsulatsi Mujarrad: (1) فَعَلَ-يَفْعُلُ, (2) فَعَلَ-يَفْعِلُ, (3) فَعَلَ-يَفْعَلُ, (4) فَعِلَ-يَفْعَلُ, (5) فَعُلَ-يَفْعُلُ, (6) فَعِلَ-يَفْعِلُ.","Huruf Mudhara'ah berharakat Dhammah (يُـ) pada Fi'il 4 huruf (أَفْعَلَ، فَعَّلَ، فَاعَلَ، فَعْلَلَ) dan Fathah (يَـ) pada selainnya.","Rumus Fi'il Amar: Buang huruf mudhara'ah + sukunkan akhir (+ tambah Hamzah jika huruf awal sukun)."],"j":1},"8":{"t":"Kalimah Fi’il Mutaddi dan Lazim","p":"Halaman 66 – 69","s":["Fi'il Muta'addi = Kata kerja yang membutuhkan Maf'ul Bih (objek), contoh: نَصَرَ، ضَرَبَ، قَرَأَ.","Fi'il Lazim = Kata kerja yang tidak membutuhkan Maf'ul Bih, contoh: جَلَسَ، قَامَ، خَرَجَ، حَسُنَ.","Seluruh Fi'il pada Bab 5 (فَعُلَ - يَفْعُلُ) dan wazan اِنْفَعَلَ adalah Fi'il Lazim.","3 Cara mengubah Lazim -> Muta'addi: (1) Wazan أَفْعَلَ, (2) Wazan فَعَّلَ, (3) Harf Jar."],"j":1},"9":{"t":"Kalimah Fi’il Ma’lum dan Majhul","p":"Halaman 64 – 65","s":["Fi'il Ma'lum = Kata kerja aktif (me-...), membutuhkan Fa'il (pelaku).","Fi'il Majhul = Kata kerja pasif (di-...), membutuhkan Na'ibul Fa'il (dibaca Rofa').","Rumus Madhi Majhul: Dhammah awal + Kasrah sebelum akhir (نَصَرَ -> نُصِرَ, أَكْرَمَ -> أُكْرِمَ).","Rumus Mudhari' Majhul: Dhammah awal + Fathah sebelum akhir (يَنْصُرُ -> يُنْصَرُ, يُكْرِمُ -> يُكْرَمُ)."],"j":1},"10":{"t":"Isim jamid dan Musytaq","p":"Halaman 70 – 71, 75 – 96","s":["Isim Jamid = Tidak terbentuk dari kata lain (dilihat di kamus), contoh: رَجُلٌ، قَلَمٌ، بَيْتٌ.","Isim Musytaq = Dibentuk dari tashrif Fi'il: Isim Fa'il, Isim Maf'ul, Isim Zaman/Makan, Isim Alat (+ Mashdar).","Isim Fa'il & Maf'ul Mujarrad: فَاعِلٌ (نَاصِرٌ) & مَفْعُولٌ (مَنْصُورٌ) | Mazid: diawali مُـ (مُكْرِمٌ vs مُكْرَمٌ).","Isim Zaman/Makan: مَفْعَلٌ / مَفْعِلٌ (مَكْتَبٌ، مَسْجِدٌ) | Isim Alat: مِفْعَلٌ، مِفْعَالٌ، مِفْعَلَةٌ (مِفْتَاحٌ، مِكْنَسَةٌ)."],"j":1},"11":{"t":"Isim Mudzakkar dan Muanntats","p":"Halaman 70 – 71, 73 – 74","s":["Isim Mudzakkar = Menunjukkan jenis laki-laki, contoh: مُحَمَّدٌ، رَجُلٌ، كِتَابٌ، قَمَرٌ.","3 Tanda Lafzhi Isim Muannats: Ta' Marbuthah (مَدْرَسَةٌ), Alif Maqshurah (كُبْرَى), Alif Mamdudah (حَمْرَاءُ).","Muannats Tanpa Tanda: Nama perempuan (مَرْيَمُ، زَيْنَبُ), anggota tubuh berpasangan (يَدٌ، عَيْنٌ، رِجْلٌ، أُذُنٌ).","Muannats Sima'i (Alam): الشَّمْسُ، الأَرْضُ، السَّمَاءُ، النَّارُ، الرِّيحُ، النَّفْسُ، الدَّارُ."],"j":1},"12":{"t":"Isim Ma’rifah dan Nakirah","p":"Halaman 70 – 72","s":["Isim Nakirah = Kata benda umum (belum tertentu), contoh: رَجُلٌ، كِتَابٌ، مَسْجِدٌ.","Isim Ma'rifah = Kata benda khusus/tertentu.","6 Macam Isim Ma'rifah: (1) Dhamir, (2) 'Alam/Nama, (3) Isyarah, (4) Maushul, (5) Ber-Al, (6) Mudhaf ke Ma'rifah.","Nama orang seperti مُحَمَّدٌ dan زَيْدٌ tetap Ma'rifah (Isim 'Alam) walaupun bertanwin."],"j":1},"13":{"t":"Isim Mu’rab dan Mabni","p":"Halaman 70 – 71, 97 – 98, 123 – 125","s":["Isim Mu'rab = Akhirnya berubah karena perbedaan 'amil (مُحَمَّدٌ - مُحَمَّدًا - مُحَمَّدٍ).","Isim Mabni = Akhirnya tetap tidak berubah dalam kondisi apa pun.","6 Kelompok Isim Mabni: (1) Dhamir, (2) Isyarah, (3) Maushul, (4) Istifham, (5) Syarat, (6) Isim Fi'il.","4 Tanda Bina': Mabni 'ala Dhammah (نَحْنُ), Fathah (أَيْنَ، أَنْتَ), Kasrah (هَٰؤُلَاءِ، هَٰذِهِ), Sukun (مَنْ، هَٰذَا)."],"j":1},"14":{"t":"I’rab Kalimah isim","p":"Halaman 98 – 103, 119 – 122","s":["3 I'rab Kalimah Isim: Rofa', Nashab, dan Jar (Isim tidak pernah Jazm).","I'rab dengan Harakat: Isim Mufrad, Jama' Taksir, Jama' Muannats Salim (Nashab dengan Kasrah), Isim Ghair Munsharif (Jar dengan Fathah).","I'rab dengan Huruf: Mutsanna (Alif / Ya), Jama' Mudzakkar Salim (Wawu / Ya), Isim Lima (Wawu / Alif / Ya).","Isim Maqshur (الفَتَى): Rofa', Nashab, Jar muqaddarah | Isim Manqush (القَاضِي): Rofa' & Jar muqaddarah, Nashab fathah zhahirah (القَاضِيَ)."],"j":1},"15":{"t":"Isim Mufrad , Mutsanna dan jama’","p":"Halaman 104 – 112","s":["Isim Mufrad (1): Rofa' = Dhammah, Nashab = Fathah, Jar = Kasrah.","Isim Mutsanna (2): Rofa' = Alif (مُسْلِمَانِ), Nashab & Jar = Ya' (مُسْلِمَيْنِ — fathah sebelum Ya', kasrah Nun).","Jama' Mudzakkar Salim (>2 Laki-laki): Rofa' = Wawu (مُسْلِمُونَ), Nashab & Jar = Ya' (مُسْلِمِينَ — kasrah sebelum Ya', fathah Nun).","Jama' Muannats Salim (>2 Perempuan): Rofa' = Dhammah (مُسْلِمَاتٌ), Nashab & Jar = Kasrah (مُسْلِمَاتٍ).","Jama' Taksir (>2 Pecah/Berubah): Rofa' = Dhammah (كُتُبٌ), Nashab = Fathah (كُتُبًا), Jar = Kasrah (كُتُبٍ)."],"j":1},"16":{"t":"Isim lima","p":"Halaman 103, 113 – 114","s":["5 Anggota Isim Lima: أَبٌ (bapak), أَخٌ (saudara), حَمٌ (ipar), فُو (mulut), ذُو (pemilik).","Tanda Rofa' Isim Lima = Huruf Wawu (و): أَبُوكَ، أَخُوكَ، ذُو عِلْمٍ.","Tanda Nashab Isim Lima = Huruf Alif (ا): أَبَاكَ، أَخَاكَ، ذَا عِلْمٍ.","Tanda Jar Isim Lima = Huruf Ya' (ي): أَبِيكَ، أَخِيكَ، ذِي عِلْمٍ."],"j":1},"17":{"t":"Isim ghair munshorif","p":"Halaman 101, 115 – 118","s":["Hukum Isim Ghair Munsharif: Tidak menerima Tanwin; Rofa' = Dhammah, Nashab = Fathah, Jar = Fathah.","Penyebab 1 'Illat: Shighat Muntahal Jumu' (مَسَاجِدُ، مَصَابِيحُ) & Alif Ta'nits Maqshurah/Mamdudah (كُبْرَى، صَحْرَاءُ، عُلَمَاءُ).","Penyebab 2 'Illat: Nama/Sifat + (Ta'nits فَاطِمَةُ/مَكَّةُ, 'Ajam إِبْرَاهِيمُ, Wazan Fi'il أَحْمَدُ/أَحْسَنُ, Alif-Nun عُثْمَانُ/رَمَضَانُ, 'Udul عُمَرُ).","Pengecualian: Jika ber-Al (فِي المَسَاجِدِ) atau menjadi Mudhaf (فِي أَحْسَنِ تَقْوِيمٍ), maka Jar kembali dengan Kasrah."],"j":1},"18":{"t":"Isim Mabni --- Dhamir","p":"Halaman 126 – 134","s":["Pembagian Dhamir: Bariz (Tampak: Munfashil & Muttashil) dan Mustatir (Tersembunyi dalam Fi'il).","Dhamir Munfashil: Rofa' (هُوَ s.d. نَحْنُ) dan Nashab (إِيَّاهُ s.d. إِيَّانَا).","Dhamir Muttashil: Rofa' (نَصَرْتُ), Nashab pada Fi'il/Inna (نَصَرَهُ، إِنَّكَ), Jar pada Isim/Harf Jar (كِتَابُهُ، بِهِ).","Dhamir هُ، هُمَا، هُمْ، هُنَّ dibaca kasrah (هِ، هِمَا، هِمْ، هِنَّ) jika didahului kasrah atau Ya' sukun (بِهِ، عَلَيْهِمْ)."],"j":1},"19":{"t":"Isim Mabni --- Isyarah","p":"Halaman 135 – 137","s":["Isyarah Dekat ('Ini'): هَٰذَا (1 Lk), هَٰذَانِ (2 Lk), هَٰذِهِ (1 Pr / Jamak tak berakal), هَاتَانِ (2 Pr), هَٰؤُلَاءِ (Jamak berakal).","Isyarah Jauh ('Itu'): ذَٰلِكَ (1 Lk), تِلْكَ (1 Pr / Jamak tak berakal), أُولَٰئِكَ (Jamak berakal).","Isyarah Tempat: هُنَا / هَاهُنَا (di sini), هُنَاكَ / هُنَالِكَ / ثَمَّ (di sana).","Kaidah Bacaan Setelah Isyarah: Tanpa Al- = Khabar Rofa' (هَٰذَا كِتَابٌ) | Ber-Al = Mengikuti i'rab Isyarah (هَٰذَا الكِتَابُ / إِنَّ هَٰذَا الكِتَابَ / فِي هَٰذَا الكِتَابِ)."],"j":1},"20":{"t":"Isim Mabni --- Maushul","p":"Halaman 138 – 141","s":["Isim Maushul = Kata sambung yang bermakna 'yang'.","Maushul Khusus Mudzakkar: الَّذِي (1), اللَّذَانِ/اللَّذَيْنِ (2), الَّذِينَ (>2).","Maushul Khusus Muannats: الَّتِي (1), اللَّتَانِ/اللَّتَيْنِ (2), اللَّاتِي/اللَّائِي (>2).","Maushul Musytarak: مَنْ (orang yang — berakal) dan مَا (apa yang — tidak berakal).","Kalimat setelah Isim Maushul disebut Shilah Maushul dan memuat dhamir penghubung ('Aid)."],"j":1},"21":{"t":"Isim Mabni --- Istifham","p":"Halaman 142","s":["Isim Istifham Utama: مَنْ (siapa), مَا/مَاذَا (apa), مَتَى/أَيَّانَ (kapan), أَيْنَ (di mana), كَيْفَ (bagaimana), كَمْ (berapa).","Tanda Bina': مَنْ، مَا، مَتَى، كَمْ = Mabni 'ala Sukun | أَيْنَ، أَيَّانَ، كَيْفَ = Mabni 'ala Fathah.","Kaidah كَمْ Istifhamiyah: Kata benda setelahnya berbentuk Mufrad Nakirah dan dibaca Nashab (كَمْ كِتَابًا عِنْدَكَ؟).","Kaidah مَنْ/مَا/مَتَى/أَيْنَ/كَيْفَ + Isim Ma'rifah: Isim setelahnya dibaca Rofa' (مَنْ رَبُّكَ؟ كَيْفَ حَالُكَ؟)."],"j":1},"22":{"t":"Isim Mabni --- Isim Syarat","p":"Halaman 97, 123 – 125","s":["Isim Syarat = Kata benda Mabni yang menghubungkan Fi'il Syarat (sebab) dan Jawab Syarat (akibat).","Isim Syarat Jazim (menjazmkan 2 Fi'il Mudhari'): مَنْ (barangsiapa), مَا/مَهْمَا (apa saja), مَتَى/أَيَّانَ (kapan saja), أَيْنَمَا/حَيْثُمَا (di mana saja), كَيْفَمَا (bagaimana saja).","Isim Syarat Ghair Jazim (tidak menjazmkan): إِذَا (apabila), كُلَّمَا (setiap kali).","3 Fungsi مَنْ: Istifham ('Siapa?'), Maushul ('Orang yang'), Syarat ('Barangsiapa ... niscaya ...')."],"j":1},"23":{"t":"Isim F’il","p":"Halaman 143 – 148","s":["Isim Fi'il = Isim Mabni yang bermakna Fi'il tetapi tidak menerima tanda Fi'il.","Isim Fi'il Madhi: هَيْهَاتَ (jauh sekali), شَتَّانَ (sangat berbeda), سُرْعَانَ (alangkah cepatnya).","Isim Fi'il Mudhari': أُفٍّ (aku mengeluh/bosan), آهِ (aku mengaduh sakit), وَيْ (aku kagum).","Isim Fi'il Amar: آمِينَ (kabulkanlah), صَهْ (diamlah), حَيَّ (marilah), هَلُمَّ (kemarilah), عَلَيْكَ (pegang teguhlah), دُونَكَ/هَاكَ (ambillah), حَذَارِ (waspadalah).","Asal-usul: Murtajal (asli), Manqul (pindahan Jar-Majrur/Zharaf/Mashdar), dan Ma'dul (wazan فَعَالِ)."],"j":1},"24":{"t":"Shighah Mubalaghah Isim Fa'il","p":"Materi tambahan (naskah «Mubalaghah Isim Fail»)","s":["Mubalaghah = isim fa'il + makna banyak / selalu / Maha.","Ada 11 wazan: فَعَّال، فَعُول، فَعِيل، مِفْعَال، مِفْعِيل، فِعِّيل، فَعَّالَة، فَيْعُول، فُعُّول، فُعَّال، فَعِل.","Semuanya sama'i: tidak bisa diqiyaskan, tidak boleh dibuat sendiri.","Tiga yang paling sering ditemui di mushaf: فَعَّال، فَعُول، فَعِيل.","Wazan sama belum tentu mubalaghah; timbang dengan makna."],"j":1},"25":{"t":"Isim Tafdhil","p":"Materi tambahan (naskah «Mubalaghah Isim Fail»)","s":["Isim tafdhil = isim bermakna lebih … dari … / paling ….","Dibentuk dari fi'il tsulatsi: fi'il madhi diubah ke wazan أَفْعَلُ.","Contoh: قَرُبَ ← أَقْرَبُ, حَسُنَ ← أَحْسَنُ, كَبُرَ ← أَكْبَرُ.","Waspada: kata benda berawalan hamzah, warna, dan cacat bukan tafdhil.","Bacalah konteks untuk memilih makna: lebih atau paling."],"j":1},"26":{"t":"Fi'il Ta'ajjub","p":"Materi tambahan (naskah «Mubalaghah Isim Fail»)","s":["Fi'il ta'ajjub = kalimah fi'il bermakna takjub: betapa …, alangkah ….","Dua wazan: مَا أَفْعَلَ dan أَفْعِلْ بِـ.","Contoh: مَا أَقْرَبَ = أَقْرِبْ بِهِ; مَا أَحْسَنَ = أَحْسِنْ بِهِ.","Bedakan: أَكْرَمُ (isim tafdhil) dan مَا أَكْرَمَ (fi'il ta'ajjub).","Di mushaf, cocokkan bentuknya; maknanya rujuk tafsir."],"j":1},"b1":{"t":"Kalimah Isim setelah Harf Jar","p":"Halaman 1 – 6","s":["Rumus: Harf Jar + KI = Jar Majrur (JM), disebut juga syibhul jumlah.","Isim setelah harf jar wajib dibaca jar.","Mufrad, jama' taksir, jama' muannats salim: jar dengan kasrah.","Mutsanna -aini; jama' mudzakkar salim -iina; ghairu munsharif fathah; isim lima ya.","Isim maqshur dan manqush: kasrah muqaddarah."],"j":2},"b2":{"t":"Kalimah Isim setelah Harf Nida","p":"Halaman 7 – 11","s":["Isim setelah harf nida disebut munada; hukumnya nashab.","Mufrad 'alam & nakirah maqshudah: mabni pada tanda rafa'-nya.","Nakirah ghair maqshudah, mudhaf, syibhul mudhaf: nashab.","Isim ber-al setelah يَا أَيُّهَا/أَيَّتُهَا dibaca rafa': badal (jamid) atau na'at (musytaq).","هَا pada أَيُّهَا disebut ha tanbih."],"j":2},"b3":{"t":"Kalimah Isim setelah Inna wa Akhwatuha","p":"Halaman 12 – 17","s":["Inna dkk: إِنَّ، أَنَّ، كَأَنَّ، لٰكِنَّ، لَيْتَ، لَعَلَّ.","Rumus: Inna dkk + KI + KI = Isim Inna (nashab) + Khabar Inna (rafa').","Qaidah 1: dhamir yang menyatu dengan inna = isim inna; isim setelahnya rafa'.","Qaidah 2: syibhul jumlah setelah inna = khabar; isim setelahnya nashab (isim inna)."],"j":2},"b4":{"t":"Kalimah Isim setelah La Nafiyah lil Jinsi","p":"Halaman 18 – 22","s":["La nafiyah lil jinsi bermakna 'tidak ada … sama sekali' dan beramal seperti inna.","Syarat: isim & khabar nakirah, tidak didahului harf jar, tidak dipisah, la tidak diulang.","Isim la mufrad: mabni fathah tanpa tanwin; mudhaf & syibhul mudhaf: nashab.","Khabar la sering dibuang (taqdir: مَوْجُوْدٌ / كَائِنٌ).","Isim ma'rifah setelah la → rafa' (mubtada); didahului harf jar → la tidak beramal."],"j":2},"b5":{"t":"Kalimah Isim setelah Harf Athaf","p":"Halaman 23 – 26","s":["Rumus: Ma'thuf 'alaih + Harf athaf + Ma'thuf.","Ma'thuf mengikuti bacaan ma'thuf 'alaih.","Ma'thuf 'alaih dibaca tergantung kalimah sebelumnya.","Harf athaf: وَ، فَـ، ثُمَّ، أَوْ، أَمْ، لَا، لٰكِنْ، حَتَّى، بَلْ."],"j":2},"b6":{"t":"Idhofah: Mudhaf dan Mudhaf Ilaih","p":"Halaman 27 – 40","s":["Idhofah = mudhaf (Md) + mudhaf ilaih (Mdi).","Mudhaf: tidak ber-al, tidak bertanwin, nun mutsanna/JMS dibuang; dibaca tergantung sebelumnya.","Mudhaf ilaih pasti dibaca jar.","Lima rumus: N+M, N+N non sifat, isim idhofah + isim, zharaf + isim, N+N+M.","Musuh mudhaf ilaih: dhamir, isyarah, maushul, ber-al, 'alam, istifham selain أَيُّ."],"j":2},"b7":{"t":"Fa'il: Pelaku Pekerjaan","p":"Halaman 41 – 53","s":["Lima jabatan isim setelah fi'il: fa'il, naibul fa'il, maf'ul bih, isim–khabar kana, dua maf'ul zhanna.","Fa'il selalu rafa' dan terletak setelah fi'il ma'lum.","Fa'il: isim zhahir atau isim dhamir (bariz/mustatir).","Fi'il no. 1 & 4: dahulukan isim zhahir; jika tidak ada, dhamir mustatir.","Fi'il tetap mufrad walaupun fa'il zhahirnya mutsanna/jama'."],"j":2},"b8":{"t":"Maf'ul Bih: Objek","p":"Halaman 54 – 61","s":["Maf'ul bih = objek; wajib nashab.","Terletak setelah fi'il muta'addi yang sudah ada fa'ilnya.","Bentuk: isim zhahir, dhamir muttashil, dhamir munfashil (إِيَّا…).","Isim setelah fi'il amar dan nahyi pasti maf'ul bih.","Posisi maf'ul bih bisa didahulukan: إِيَّاكَ نَعْبُدُ، زَيْدًا ضَرَبْتُ."],"j":2},"b9":{"t":"Naibul Fa'il: Pengganti Fa'il","p":"Halaman 62 – 67","s":["Hukum naibul fa'il sama dengan fa'il: rafa'.","Naibul fa'il terletak setelah fi'il majhul; fa'il setelah fi'il ma'lum.","Makna fa'il: pelaku; makna naibul fa'il: objek.","Asal naibul fa'il adalah maf'ul bih.","Bentuk: isim zhahir dan isim dhamir (muttashil/mustatir)."],"j":2},"b10":{"t":"Kalimah Isim setelah Kana wa Akhwatuha","p":"Halaman 68 – 72","s":["Pola kana dkk: isim kana rafa', khabar kana nashab.","Kana dkk: كَانَ، صَارَ، أَصْبَحَ، أَمْسَى، أَضْحَى، ظَلَّ، بَاتَ، لَيْسَ، مَا زَالَ، مَا فَتِئَ، مَا بَرِحَ، مَا انْفَكَّ، مَا دَامَ.","Kana + dhamir: dhamir = isim kana; isim setelahnya nashab.","Kana + syibhul jumlah: SJ = khabar; isim setelahnya rafa'."],"j":2},"b11":{"t":"Kalimah Isim setelah Zhanna wa Akhwatuha","p":"Halaman 73 – 76","s":["Zhanna dkk: ظَنَّ، حَسِبَ، خَالَ، عَلِمَ، رَأَى، جَعَلَ، اتَّخَذَ، رَدَّ.","Setelah fa'il, dua isim dibaca nashab: maf'ul 1 dan maf'ul 2.","Asal dua maf'ul adalah mubtada dan khabar.","Pola: inna nashab–rafa', kana rafa'–nashab, zhanna nashab–nashab."],"j":2},"b12":{"t":"Mubtada dan Khabar","p":"Halaman 77 – 95","s":["Mubtada dan khabar sama-sama rafa'; gabungannya jumlah ismiyah.","Mubtada dan khabar sama dalam jumlah dan jenis.","Q1–Q4: M+N, M+M non sifat, M+SJ, SJ+KI.","Q5–Q9: isim setelah إِنَّمَا، أَمَّا، harf nafi، أَلَا، لَوْلَا.","Q10–Q14: dhamir munfashil, isyarah, isim mubham, M+JF, M+JI."],"j":2},"b13":{"t":"Tawabi': Na'at, Taukid, dan Badal","p":"Halaman 96 – 107","s":["Tawabi': na'at, athaf, taukid, badal; semuanya mengikuti bacaan sebelumnya.","Na'at–man'ut sama dalam jenis, jumlah, ma'rifah–nakirah, dan i'rab.","Taukid lafzhi mengulang kata; maknawi memakai نَفْسٌ، عَيْنٌ، كِلَا، كِلْتَا، كُلٌّ، جَمِيْعٌ.","Badal: muthabiq, ba'dh min kull, isytimal, mubayin.","Ciri badal: jika mubdal minhu dibuang, makna tidak berubah."],"j":2},"b14":{"t":"Maf'ul Fih (Zharaf)","p":"Halaman 108 – 112","s":["Isim setelah jumlah fi'liyah umumnya nashab (8 jabatan).","Maf'ul fih = zharaf: keterangan waktu (zaman) atau tempat (makan).","Zharaf dibaca nashab; jika didahului فِيْ dibaca jar.","Isim setelah zharaf = mudhaf ilaih (jar)."],"j":2},"b15":{"t":"Maf'ul Mutlaq, Maf'ul Min Ajlih, dan Maf'ul Ma'ah","p":"Halaman 113 – 118","s":["Maf'ul mutlaq: mashdar nakirah dari fi'il yang sama; nashab.","Fungsi maf'ul mutlaq: taukid, marrah (bilangan), hai'ah (jenis).","Maf'ul min ajlih: mashdar nakirah berbeda; makna untuk/karena.","Maf'ul ma'ah: isim setelah wawu ma'iyah (bersama); nashab."],"j":2},"b16":{"t":"Hal: Penjelas Keadaan","p":"Halaman 119 – 125","s":["Hal menjelaskan keadaan fa'il atau maf'ul bih; makna: sambil / dalam keadaan.","Rukun hal: hal, shahibul hal, 'amil.","Hal: isim sifat nakirah, nashab; shahibul hal: ma'rifah.","Hal sama dengan shahibul hal dalam jenis dan jumlah.","Bentuk hal: mufrad, jumlah (ismiyah/fi'liyah), syibhul jumlah (zharaf/jar majrur)."],"j":2},"b17":{"t":"Tamyiz: Penjelas yang Samar","p":"Halaman 126 – 133","s":["Tamyiz: isim jamid nakirah penjelas yang samar; nashab.","Tamyiz dzat: setelah maqadir dan 'adad.","'Adad 3–10 + jama' jar; 11–19 & puluhan + mufrad nashab; 100 & 1000 + mufrad jar.","Tamyiz nisbat: setelah JF, كَفَى بِـ, isim tafdhil, نِعْمَ/بِئْسَ/سَاءَ."],"j":2},"b18":{"t":"Mustatsna: yang Dikecualikan","p":"Halaman 134 – 139","s":["Mustatsna setelah alat istitsna'; mustatsna minhu sebelumnya.","Illaa: tam mujab → nashab; tam manfi → nashab/badal; munqathi' → nashab.","Illaa mufarragh → sesuai kebutuhan (rafa', nashab, jar).","Ghairu/siwaa → isim setelahnya jar (mudhaf ilaih).","Khalaa/'adaa/haasyaa → nashab/jar; didahului مَا → nashab."],"j":2}},"qm":{}}</script>

function featChips(w){
  var out=[];
  (w.ft||[]).forEach(function(f){
    var m;
    if((m=/^([123])([MF])([SDP])$/.exec(f))){
      out.push({1:'mutakallim',2:'mukhathab',3:'ghaib'}[m[1]]); out.push({M:'mudzakkar',F:'mu’annats'}[m[2]]); out.push({S:'mufrad',D:'mutsanna',P:'jamak'}[m[3]]);
    }else if((m=/^([MF])([SDP])$/.exec(f))){
      out.push({M:'mudzakkar',F:'mu’annats'}[m[1]]); out.push({S:'mufrad',D:'mutsanna',P:'jamak'}[m[2]]);
    }else if(f==='1S'){out.push('mutakallim','mufrad')}
    else if(f==='1P'){out.push('mutakallim','jamak')}
    else if(f==='PASS')out.push('mabni lil majhul');
    else if(f==='ACT'||f==='PCPL'||f==='VN'||f==='PERF'||f==='IMPF'||f==='IMPV'){/* sudah di kategori */}
    else if(f==='NOM')out.push('marfu’');
    else if(f==='ACC')out.push('manshub');
    else if(f==='GEN')out.push('majrur');
    else if(f==='INDEF')out.push('nakirah');
    else if(f==='MOOD:JUS')out.push('majzum');
    else if(f==='MOOD:SUBJ')out.push('manshub (mudhari’)');
  });
  var seen={};return out.filter(function(x){if(seen[x])return false;seen[x]=1;return true});
}

function doSearch(v){

  var hits=[];
  allWords.forEach(function(w){ if((w.ro&&norm(w.ro)===q)||(!w.ro&&norm(w.l)===q)) hits.push([w._a,w._w]) });
  if(!hits.length){
    allWords.forEach(function(w){ if(norm(w.l)===q||norm(w.t)===q) hits.push([w._a,w._w]) });

  if(hits.length){
    state.hi=0; showWord(hits[0][0],hits[0][1]);
    var e=wordEl(hits[0][0],hits[0][1]); if(e)e.scrollIntoView({block:'nearest'});
  }
}

function stepHit(d){

    if(f==='decided'&&dec===null) return;
    if(f==='cand'&&!g.cand) return;
    if(f.charAt(0)==='c'&&f.length<=3&&major!==+f.slice(1)) return;
    total++;
    if(rows.length<200) rows.push([g,major,kinds]);
  });
  var h='';
  rows.forEach(function(r){
    var g=r[0], c=r[1];
    h+='<tr class="click" data-a="'+g.first[0]+'" data-w="'+g.first[1]+'"><td><span class="ar" lang="ar">'+esc(g.l)+'</span></td><td><span class="ar" lang="ar">'+esc(g.ro)+'</span></td><td>'+(g.jv.length?g.jv.map(function(x){return '<span class="ar" lang="ar">'+esc(x)+'</span>'}).join('، '):'<span style="color:var(--muted)">-</span>')+'</td><td class="num2">'+g.n+'</td><td class="c'+c+'"><b>'+CID[c]+'</b>'+(r[2]>1?' <small style="color:var(--muted)">(campuran)</small>':'')+'</td><td>'+lemmaCell(g.l)+'</td></tr>';
  });
  if(!rows.length) h='<tr><td colspan="6" style="color:var(--muted)">Tidak ada lemma yang cocok.</td></tr>';
  body.innerHTML=h;
  $('lemc').textContent=fmt(total)+' lemma'+(total>rows.length?', menampilkan '+rows.length+' teratas menurut jumlah kata; persempit dengan pencarian':'');
}
function renderRev(){
  var h='';
  h+='<div class="card tbl" style="margin-top:16px"><h2>Semua lemma isim</h2>';
  h+='<p class="hint">Satu baris satu lemma. Pilih warna pada menu di kolom terakhir untuk mewarnai <b>semua kata ber-lemma itu sekaligus</b> di seluruh mushaf (tampil pada mode "Hasil edit"). Edit per kata tetap lebih diutamakan daripada putusan lemma. Cari dengan huruf Arab (lemma atau akar, tanpa harakat juga bisa).'+(canEditNow()?'':' Aktifkan Mode edit untuk memberi putusan.')+'</p>';
  h+='<div class="bar" style="margin-top:0"><div class="field"><label for="lemq">Cari</label><input id="lemq" type="search" dir="rtl" lang="ar" class="ar" placeholder="مثال: رب" autocomplete="off" value="'+esc(state.lemq||'')+'"></div>';
  h+='<div class="field"><label for="lemf">Tampilkan</label><select id="lemf"><option value="all">semua</option><option value="undecided">belum diputuskan</option><option value="decided">sudah diputuskan</option><option value="cand">akar punya fi’il bentuk I</option>';
  for(var ci=0;ci<NCAT;ci++) if(ci!==1) h+='<option value="c'+ci+'">warna: '+CID[ci]+'</option>';
  h+='</select></div><span class="hint" id="lemc" style="margin:0"></span></div>';
  h+='<div class="tblwrap"><table><thead><tr><th>Lemma</th><th>Akar</th><th>Fi’il dari akar</th><th class="num2">Kata</th><th>Warna sekarang</th><th>Putusan lemma</th></tr></thead><tbody id="lemb"></tbody></table></div></div>';
  $('v-rev').innerHTML=h; revDone=true;
  $('lemf').value=state.lemf||'all'; renderLemList();
}
function copyTSV(){
  var rows=allWords.filter(function(w){return w.fl&&(!revStrict||!w.wk)});
  var t='ayat\tkata\tteks\twarna_abi\tusulan_korpus\tketerangan\n';
  rows.forEach(function(w){t+=rf(w._a)+'\t'+w._w+'\t'+w.t+'\t'+CATS[w.c]+'\t'+(w.cc!=null?CATS[w.cc]:(w.ex||[]).map(function(i){return CATS[i]}).join('/'))+'\t'+w.ct+'\n'});
  function ok(){$('copied').textContent='Daftar disalin'}
  function fail(){var ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');ok()}catch(e){$('copied').textContent='Gagal menyalin'}document.body.removeChild(ta)}
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(ok,fail)}else fail();
}

/* ---------- penyimpanan edit (db) ---------- */
var chain=Promise.resolve();
function queue(fn){
  chain=chain.then(fn).catch(function(err){
    var m='Gagal menyimpan: '+((err&&err.message)||err);
    state.msg=m; var el=$('ed-msg'); if(el)el.textContent=m;
  });
  return chain;
}
function nowIso(){return new Date().toISOString()}
function metaDoc(d){d.by=state.uid||null;d.at=nowIso();return d}
function onlyMeta(d){return Object.keys(d).every(function(k){return k==='by'||k==='at'})}
function writeWord(w,doc){
  var ref=state.db.doc('words/'+wkey(w));
  var empty=onlyMeta(doc);
  return queue(function(){return empty?ref.delete():ref.set(doc)});
}
function saveEditor(){
  var w=AY[state.sel[0]-1][state.sel[1]-1];
  var old=wedit(w)||{}, doc={};
  var ro=$('ed-ro').value.trim(), lm=$('ed-l').value.trim();
  if(ro&&ro!==(w.ro||'')) doc.ro=ro;
  if(lm&&lm!==w.l) doc.l=lm;
  var fm=$('ed-fm').value; if(fm&&fm!==(w.fm||'I')) doc.fm=fm;
  var bb=+$('ed-bb').value; if(bb&&bb!==w.bb) doc.bb=bb;
  var note=$('ed-note').value.trim(); if(note) doc.note=note;
  if($('ed-ok').checked) doc.ok=true;
  var pick=(state.pickC!==undefined)?state.pickC:(old.c!=null?old.c:null);
  var lemmaBox=$('ed-lemma'), lemmaOn=!!(lemmaBox&&lemmaBox.checked);
  var lref=state.db.doc('lemmas/'+lkey(w.l));
  if(lemmaBox){
    if(lemmaOn&&pick!=null){ queue(function(){return lref.set(metaDoc({c:pick}))}); }
    else if(!lemmaOn&&state.edits.lemmas[lkey(w.l)]){ queue(function(){return lref.delete()}); }
  }
  if(pick!=null&&pick!==w.nc&&!lemmaOn) doc.c=pick;
  metaDoc(doc);
  var p=writeWord(w,doc);
  state.msg='Tersimpan';
  p.then(function(){ if(state.mode!=='edit') setMode('edit'); else if(state.sel) showWord(state.sel[0],state.sel[1],true); });
}
function resetWord(){
  var w=AY[state.sel[0]-1][state.sel[1]-1];
  var ref=state.db.doc('words/'+wkey(w));
  state.pickC=undefined; state.msg='Edit kata dihapus';
  queue(function(){return ref.delete()}).then(function(){ if(state.sel) showWord(state.sel[0],state.sel[1],true); });
}
function lemmaDecision(l,v){
  var ref=state.db.doc('lemmas/'+lkey(l));
  queue(function(){return v==='x'?ref.delete():ref.set(metaDoc({c:+v}))}).then(function(){if(v!=='x'&&state.mode!=='edit')setMode('edit')});
}
function rvChange(key,val){
  var m=keyGid(key); if(!m) return;
  var w=AY[m[0]-1][m[1]-1], doc=Object.assign({},wedit(w)||{});
  if(val==='') delete doc.c; else doc.c=(val==='cc')?w.cc:+val;
  metaDoc(doc);
  writeWord(w,doc).then(function(){if(val!==''&&state.mode!=='edit')setMode('edit')});
}
var rafPending=false;
function onEditsChanged(){
  if(rafPending) return; rafPending=true;
  requestAnimationFrame(function(){
    rafPending=false;
    renderMushaf(); renderLegend(); statDone=false;
    var ae=document.activeElement, typing=ae&&ae.closest&&ae.closest('#editor');
    if(state.sel&&!typing) showWord(state.sel[0],state.sel[1],true);
    if(!$('v-stat').hidden) renderStat();
    if(!$('v-rev').hidden){ if($('lemb')) renderLemList(); else renderRev(); }
    if(!$('v-edit').hidden) renderEditTab();
  });
}
function subscribe(){
  var errf=function(e){var el=$('ed-msg'); if(el)el.textContent='Sinkronisasi berhenti: '+((e&&e.message)||e)};
  state.db.collection('words').onSnapshot(function(s){var m={};s.docs.forEach(function(d){m[d.id]=d.data()});state.edits.words=m;onEditsChanged()},errf);
  state.db.collection('lemmas').onSnapshot(function(s){var m={};s.docs.forEach(function(d){m[d.id]=d.data()});state.edits.lemmas=m;onEditsChanged()},errf);
}
function describeEdit(d,w){
  var parts=[];
  if(d.c!=null) parts.push('warna '+(w?CID[w.nc]+' \u2192 ':'')+CID[d.c]);
  if(d.ro) parts.push('akar \u2192 '+d.ro);
  if(d.l) parts.push('lemma \u2192 '+d.l);
  if(d.fm) parts.push('wazan \u2192 bentuk '+d.fm);
  if(d.bb) parts.push('bab \u2192 '+d.bb);
  if(d.note) parts.push('catatan: '+d.note);
  if(d.ok) parts.push('terverifikasi');
  return parts.join('; ');
}
function editRows(){
  var rows=[], lmap={};
  allWords.forEach(function(w){lmap[lkey(w.l)]=w.l});
  Object.keys(state.edits.words).forEach(function(id){
    var m=keyGid(id); if(!m) return;
    var a=m[0], wi=m[1], w=AY[a-1]&&AY[a-1][wi-1]; if(!w) return;
    var d=state.edits.words[id];
    rows.push({type:'kata',a:a,w:wi,t:w.t,desc:describeEdit(d,w),by:d.by,at:d.at,id:id});
  });
  Object.keys(state.edits.lemmas).forEach(function(id){
    var d=state.edits.lemmas[id], l=lmap[id]; if(!l) return;
    rows.push({type:'lemma',a:0,w:0,t:l,desc:'semua isim ber-lemma ini \u2192 '+CID[d.c],by:d.by,at:d.at,id:id,lemma:l});
  });
  rows.sort(function(x,y){return (x.type===y.type?0:(x.type==='kata'?-1:1))||x.a-y.a||x.w-y.w});
  return rows;
}
function renderEditTab(){
  var rows=editRows();
  var h='<div class="card tbl" style="margin-top:16px"><h2>Semua edit</h2>';
  if(!state.db){
    h+='<p class="hint">Penyimpanan edit tidak tersedia pada tampilan ini. Buka halaman dari akun yang punya akses untuk mengedit.</p></div>';
    $('v-edit').innerHTML=h; return;
  }
  h+='<p class="hint">Edit disimpan di penyimpanan bersama halaman ini dan dibaca ulang setiap kali halaman dibuka, dari perangkat mana pun. Warna hasil edit tampil pada mode "Hasil edit" (15 kategori).'+(state.canWrite?'':' Akun ini hanya bisa melihat.')+'</p>';
  if(!rows.length){
    h+='<p>Belum ada edit. Aktifkan <b>Mode edit</b>, pilih satu kata di mushaf, lalu ubah warna, akar, lemma, wazan, bab, atau tambahkan catatan.</p></div>';
    $('v-edit').innerHTML=h; return;
  }
  h+='<div class="bar" style="margin-top:0"><button class="btn" id="copyedits">Salin semua edit</button><span class="hint" id="copied3" style="margin:0"></span><span class="hint" style="margin:0">'+rows.length+' edit</span></div>';
  h+='<div class="tblwrap"><table><thead><tr><th>Jenis</th><th>Ayat:kata</th><th>Kata</th><th>Perubahan</th><th>Oleh</th><th>Waktu</th><th></th></tr></thead><tbody>';
  rows.forEach(function(r){
    h+='<tr><td>'+r.type+'</td><td>'+(r.a?rf(r.a)+':'+r.w:'-')+'</td><td><span class="ar" lang="ar">'+esc(r.t)+'</span></td><td style="min-width:14rem">'+esc(r.desc)+'</td><td><span data-uid="'+esc(r.by||'')+'">Penyunting</span></td><td style="white-space:nowrap">'+(r.at?new Date(r.at).toLocaleString('id-ID',{dateStyle:'medium',timeStyle:'short'}):'')+'</td><td style="white-space:nowrap">'+(r.a?'<button class="btn sm" data-open="'+r.a+'_'+r.w+'">Buka</button> ':'')+(state.canWrite?'<button class="btn sm" data-del="'+esc(r.type+':'+r.id)+'">Hapus</button>':'')+'</td></tr>';
  });
  h+='</tbody></table></div></div>';
  $('v-edit').innerHTML=h;
  var ids=[];rows.forEach(function(r){if(r.by&&ids.indexOf(r.by)<0)ids.push(r.by)});
  if(state.user&&ids.length){
    state.user.profiles(ids).then(function(ps){
      document.querySelectorAll('#v-edit [data-uid]').forEach(function(el){var pr=ps[el.getAttribute('data-uid')]; if(pr&&pr.name) el.textContent=pr.isMe?pr.name+' (Anda)':pr.name});
    });
  }
}
function copyEdits(){
  var t='jenis\tayat\tkata\tteks\tperubahan\twaktu\n';
  editRows().forEach(function(r){t+=[r.type,r.a?rf(r.a):'',r.w||'',r.t,r.desc,r.at||''].join('\t')+'\n'});
  function ok(){$('copied3').textContent='Daftar disalin'}
  function fail(){var ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');ok()}catch(e){$('copied3').textContent='Gagal menyalin'}document.body.removeChild(ta)}
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(ok,fail)}else fail();
}
function setEditMode(on){
  state.editMode=!!on;
  var b=$('edtog'); b.setAttribute('aria-pressed',String(state.editMode)); b.classList.toggle('on',state.editMode); b.textContent=state.editMode?'Mode edit aktif':'Mode edit';
  if(state.sel) showWord(state.sel[0],state.sel[1],true);
  if(!$('v-rev').hidden) renderRev();
}

/* ---------- navigation ---------- */
function goto(a){
  a=Math.max(1,Math.min(AY.length,a||1));
  setTab('baca');
  gotoPage(APAGE[a]!=null?APAGE[a]:0);
  var e=wordEl(a,1); if(e){e.classList.remove('flash');void e.offsetWidth;e.classList.add('flash');e.scrollIntoView({block:'nearest'})}
}
function setTab(t){
  ['baca','stat','rev','edit'].forEach(function(k){
    $('v-'+k).hidden=(k!==t);
    $('tab-'+k).setAttribute('aria-selected',String(k===t));
  });
  if(t==='stat')renderStat();
  if(t==='rev')renderRev();
  if(t==='edit')renderEditTab();
}
function setMode(m){
  state.mode=m;
  $('m-abi').setAttribute('aria-pressed',String(m==='abi'));
  $('m-edit').setAttribute('aria-pressed',String(m==='edit'));
  renderMushaf(); renderLegend(); statDone=false;
  if(state.sel) showWord(state.sel[0],state.sel[1],true);
  if(!$('v-stat').hidden) renderStat();
}

/* ---------- events ---------- */
document.addEventListener('click',function(ev){
  var t=ev.target;
  var el;
  if((el=t.closest('[data-lm]'))){lemmaDecision(el.getAttribute('data-lm'),el.getAttribute('data-v'));return}
  if(t.closest('select')) return;
  if((el=t.closest('[data-pick]'))){state.pickC=+el.getAttribute('data-pick');document.querySelectorAll('.pick').forEach(function(b){b.setAttribute('aria-pressed',String(b===el))});return}
  if(t.closest('#ed-save')){saveEditor();return}
  if(t.closest('#ed-reset')){resetWord();return}
  if(t.closest('#edtog')){setEditMode(!state.editMode);return}
  if(t.closest('#copyedits')){copyEdits();return}
  if((el=t.closest('[data-open]'))){var pr=el.getAttribute('data-open').split('_');setTab('baca');goto(+pr[0]);showWord(+pr[0],+pr[1]);return}
  if((el=t.closest('[data-del]'))){var dv=el.getAttribute('data-del'),ix=dv.indexOf(':'),ty=dv.slice(0,ix),id=dv.slice(ix+1);var ref=state.db.doc((ty==='kata'?'words/':'lemmas/')+id);queue(function(){return ref.delete()});return}
  if((el=t.closest('.w'))){showWord(+el.getAttribute('data-a'),+el.getAttribute('data-w'));return}
  if((el=t.closest('[data-goto]'))){var gp=el.getAttribute('data-goto').split(':');goto(GID[gp[0]+':'+gp[1]]);return}
  if((el=t.closest('.lg'))){var c=el.getAttribute('data-cat');state.cats[c]=!state.cats[c];el.setAttribute('aria-pressed',String(!!state.cats[c]));applyDim();return}
  if((el=t.closest('[data-tab]'))){setTab(el.getAttribute('data-tab'));return}
  if(t.closest('#pclose')){$('panel').classList.remove('open');return}
  if(t.closest('#sc-root')){state.scopeRoot=true;var w=AY[state.sel[0]-1][state.sel[1]-1];renderStats(w);return}
  if(t.closest('#sc-lem')){state.scopeRoot=false;var w2=AY[state.sel[0]-1][state.sel[1]-1];renderStats(w2);return}
  if(t.closest('#copytsv')){copyTSV();return}
  if(t.closest('#copytsv2')){copyTSV2();return}
  if((el=t.closest('tr[data-root]'))){var r=el.getAttribute('data-root');setTab('baca');$('q').value=r;doSearch(r);return}
  if((el=t.closest('tr[data-a]'))){var a=+el.getAttribute('data-a'),wn=+el.getAttribute('data-w');setTab('baca');goto(a);showWord(a,wn);return}
});
document.addEventListener('toggle',function(ev){
  var d=ev.target; if(d&&d.tagName==='DETAILS'&&d.open&&d.getAttribute('data-lazy')) fillDetail(d);
},true);
$('m-abi').addEventListener('click',function(){setMode('abi')});
$('m-edit').addEventListener('click',function(){setMode('edit')});

$('q').addEventListener('input',function(e){doSearch(e.target.value)});
$('pnext').addEventListener('click',function(){gotoPage(state.page+1)});
$('pprev').addEventListener('click',function(){gotoPage(state.page-1)});
$('qnext').addEventListener('click',function(){stepHit(1)});
$('qprev').addEventListener('click',function(){stepHit(-1)});
$('psel').innerHTML=LAY.map(function(_,i){return '<option value="'+i+'">'+(i+531)+'</option>'}).join('');
$('psel').addEventListener('change',function(){gotoPage(+this.value)});
document.addEventListener('keydown',function(ev){
  if($('v-baca').hidden||/INPUT|SELECT|TEXTAREA/.test(ev.target.tagName)) return;
  if(ev.key==='ArrowLeft') gotoPage(state.page+1); else if(ev.key==='ArrowRight') gotoPage(state.page-1);
});
if(window.ResizeObserver){var rt;new ResizeObserver(function(){clearTimeout(rt);rt=setTimeout(fitLines,60)}).observe($('mushaf'))}
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(fitLines);
$('jsur').addEventListener('change',function(){var m=78;$('jump').max=m;$('jump').placeholder='1–'+m;if($('jump').value)$('jump').dispatchEvent(new Event('change'))});
$('jump').addEventListener('change',function(e){var v=parseInt(e.target.value,10),sr=55,m=78;if(v){goto(GID[sr+':'+Math.max(1,Math.min(m,v))])}});
document.addEventListener('input',function(e){ if(e.target&&e.target.id==='lemq'){state.lemq=e.target.value; renderLemList();} });
document.addEventListener('change',function(e){
  if(e.target&&e.target.id==='lemf'){state.lemf=e.target.value; renderLemList();}
  if(e.target.id==='strict'){revStrict=e.target.checked;renderRev()}
  if(e.target.getAttribute&&e.target.getAttribute('data-rv')){rvChange(e.target.getAttribute('data-rv'),e.target.value)}
  if(e.target.getAttribute&&e.target.getAttribute('data-lmsel')!=null){var lv=e.target.value; lemmaDecision(e.target.getAttribute('data-lmsel'), lv===''?'x':lv)}
});

/* ---------- init ---------- */
$('sub').textContent=fmt(allWords.length)+' kata dari '+AY.length+' ayat, disajikan per halaman Mushaf Madinah (hlm. 531–534, Juz 27). Ketuk kata untuk melihat bedah sharaf dan sebaran derivatnya di seluruh Al-Qur’an.';
renderMushaf(); renderLegend();
$('panel').innerHTML='<div class="empty"><b>Pilih satu kata di mushaf.</b><p>Panel ini menampilkan segmen kata, akar, wazan, dan semua bentuk turunan dari akar yang sama, lengkap dengan surah dan nomor ayatnya.</p><p class="hint">Warna kata mengikuti file mushaf sharfi Abi. Awalan, akhiran, dan kata “ال” diberi warna otomatis.</p></div>';
// sambungkan penyimpanan edit bila tersedia
(function(){
  if(!(window.claude&&window.claude.use)) return;
  window.claude.use('db').then(function(db){
    if(!db) return;
    state.db=db;
    return window.claude.use('user').then(function(user){
      state.user=user;
      if(!user) return {id:null,cw:true};
      return Promise.all([user.id(),user.can('data.write')]).then(function(r){return {id:r[0],cw:r[1]}});
    }).then(function(r){
      state.uid=r.id; state.canWrite=(r.cw!==false);
      if(state.canWrite) $('edtog').hidden=false;
      subscribe();
    });
  }).catch(function(){});
})();
// contoh awal: kata pertama yang berakar
(function(){var f=allWords.filter(function(w){return w.ro&&w._a===3})[0]; if(f){state.sel=null; showWord(f._a,f._w); if(window.matchMedia('(max-width:900px)').matches)$('panel').classList.remove('open'); state.sel=[f._a,f._w]; markSel();}})();
})();
</script>
