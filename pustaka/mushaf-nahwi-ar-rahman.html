<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Mushaf Nahwi Ar-Rahman</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Amiri:wght@400;700&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
/* Layout: halaman mushaf (15 baris, seperti cetakan Madinah) di kiri, panel i'rab menempel di kanan; di ponsel panel jadi lembar bawah. */
:root{
  --bg:#eef2f0; --surface:#ffffff; --ink:#15211b; --muted:#56665d; --line:#d3dcd6;
  --accent:#0f5f4a; --accent-soft:#dbede5; --accent-ink:#ffffff;
  --ok:#17803d; --ok-soft:#ddf3e3; --bad:#b42318; --bad-soft:#fde4e1;
  --ui:'Source Sans 3',system-ui,-apple-system,'Segoe UI',sans-serif;
  --quran:'Amiri Quran','Amiri','Noto Naskh Arabic',serif;
  --ar:'Amiri','Noto Naskh Arabic',serif;
  --shadow:0 6px 24px rgba(10,30,20,.14);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1714; --surface:#17221d; --ink:#e5ede8; --muted:#9bada3; --line:#2b3b33;
    --accent:#56c9a0; --accent-soft:#1e3a30; --accent-ink:#06150e;
    --ok:#5fd68a; --ok-soft:#173a25; --bad:#ff8a7a; --bad-soft:#3d1a16;
    --shadow:0 6px 24px rgba(0,0,0,.5);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1714; --surface:#17221d; --ink:#e5ede8; --muted:#9bada3; --line:#2b3b33;
  --accent:#56c9a0; --accent-soft:#1e3a30; --accent-ink:#06150e;
  --ok:#5fd68a; --ok-soft:#173a25; --bad:#ff8a7a; --bad-soft:#3d1a16;
  --shadow:0 6px 24px rgba(0,0,0,.5);
  color-scheme:dark;
}

/* Latar mushaf: palet i'rab dipilih agar tiap warna sejauh mungkin satu sama lain dan kontras dengan latarnya. */
:root{--paper:#ffffff;--paper-ink:#111111;--paper-rule:#b59a52;--paper-num:#6b5418;--paper-mut:#5f5f58;--hl:#c77700;--hl-bg:rgba(255,190,40,.22);--sel:#0f5f4a;--sel-bg:rgba(15,95,74,.10);--k0:#CC2288;--k1:#775599;--k2:#552200;--k3:#AA5555;--k4:#554400;--k5:#AA5500;--k6:#442255;--k7:#006699;--k8:#2244EE;--k9:#5500CC;--k10:#882200;--k11:#883377;--k12:#CC1155;--k13:#994466;--k14:#774400;--k15:#AA22AA;--k16:#CC0000;--k17:#AA00FF;--k18:#007722;--k19:#222288;--k20:#881122;--k21:#004488;--k22:#DD0033;--k23:#111111;--k24:#5566AA;--k25:#770088;--k26:#771144;--k27:#886600;}
:root[data-pm="dk"]{--paper:#101416;--paper-ink:#f2f2f2;--paper-rule:#7d6a35;--paper-num:#e0c77e;--paper-mut:#a9b0ab;--hl:#ffb02e;--hl-bg:rgba(255,176,46,.20);--sel:#7fe0bd;--sel-bg:rgba(127,224,189,.14);--k0:#EEEE00;--k1:#BBAA66;--k2:#BBBBFF;--k3:#FFCCAA;--k4:#FF77BB;--k5:#FF8855;--k6:#EEDDAA;--k7:#00AAFF;--k8:#99DDFF;--k9:#FF7788;--k10:#8899FF;--k11:#88BBFF;--k12:#CC9900;--k13:#CCBB00;--k14:#00BBDD;--k15:#FFAA99;--k16:#FF4444;--k17:#EE66FF;--k18:#22CC44;--k19:#FFAABB;--k20:#FFCC55;--k21:#BB99CC;--k22:#BB88FF;--k23:#f2f2f2;--k24:#CC9966;--k25:#FFBBFF;--k26:#00DDDD;--k27:#FF9900;}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:15px;line-height:1.5;margin:0}
.wrap{max-width:1300px;margin:0 auto;padding-block:18px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ar{font-family:var(--ar)}
header.top{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between;padding-bottom:14px;border-bottom:1px solid var(--line)}
header.top h1{margin:0;font-size:1.55rem;font-weight:700;letter-spacing:-.01em;text-wrap:balance;display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}
header.top h1 .ar{font-size:1.5rem;color:var(--accent);font-weight:400}
header.top p{margin:2px 0 0;color:var(--muted);max-width:62ch}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:var(--surface);padding:7px 14px;border-radius:8px;font-weight:600;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.bar{display:flex;flex-wrap:wrap;gap:10px 12px;align-items:center;margin:14px 0 10px}
.field{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:0 10px;min-width:0}
.field input,.field select{border:0;background:transparent;padding:7px 0;min-width:0;outline:0}
.field:focus-within{border-color:var(--accent)}
.field label{color:var(--muted);font-size:.85rem;white-space:nowrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px;font-weight:600}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.sm{padding:3px 9px;font-size:.85rem}
.btn.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.45;cursor:default}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:6px 11px;color:var(--muted);font-weight:600}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.hint{color:var(--muted);font-size:.9rem;margin:0}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.lg{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 10px 3px 8px;font-size:.86rem;color:var(--ink)}
.lg i{width:12px;height:12px;border-radius:50%;display:inline-block;flex:none}
.lg small{color:var(--muted);font-variant-numeric:tabular-nums}
.lg[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--accent-soft)}
.layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(320px,420px);gap:20px;align-items:start}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px}

/* Halaman mushaf: selalu kertas terang agar warna i'rab dari file Abi tetap terbaca di tema gelap */
.pagewrap{display:flex;flex-direction:column;gap:10px;min-width:0}
.pnav{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.pnav .mid{display:flex;align-items:center;gap:8px;color:var(--muted);font-variant-numeric:tabular-nums}
.paper{background:var(--paper);color:var(--paper-ink);border:1px solid var(--paper-rule);border-radius:6px;padding:10px;container-type:inline-size;box-shadow:var(--shadow)}
.frame{border:2px solid var(--paper-rule);outline:1px solid var(--paper-rule);outline-offset:3px;padding:clamp(8px,2.4cqi,22px) clamp(8px,2.6cqi,26px);margin:4px}
.ln{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;direction:rtl;font-family:var(--quran);font-size:clamp(17px,3.75cqi,31px);line-height:2.15;column-gap:.18em}
.ln.short{justify-content:center;column-gap:.5em}
.sh{direction:rtl;text-align:center;font-family:var(--ar);font-size:clamp(17px,3.6cqi,28px);color:var(--paper-num);border:1.5px solid var(--paper-rule);border-radius:4px;margin:.25em 8%;padding:.05em 0}
.sh .w{color:var(--paper-num)!important}
.w{cursor:pointer;border-radius:5px;padding:0 1px;white-space:nowrap}
.w:hover{background:var(--sel-bg)}
.w.sel{background:var(--sel-bg);box-shadow:0 0 0 2px var(--sel)}
.w.hit{background:var(--hl-bg);box-shadow:0 0 0 2px var(--hl)}
.w.ed{text-decoration:underline;text-decoration-style:dotted;text-decoration-color:var(--sel);text-underline-offset:.35em}
.w.flash{animation:fl 1.6s ease-out 1}
@keyframes fl{0%{box-shadow:0 0 0 4px var(--hl)}100%{box-shadow:0 0 0 0 transparent}}
.s.dim{opacity:.16}
.num{display:inline-flex;align-items:center;justify-content:center;min-width:1.55em;height:1.55em;padding:0 .15em;border:1.5px solid var(--paper-num);border-radius:50%;font-family:var(--ar);font-size:.56em;line-height:1;color:var(--paper-num);vertical-align:.2em}
.pfoot{display:flex;justify-content:space-between;color:var(--paper-num);font-family:var(--ar);font-size:.95rem;padding:2px 8px 0;direction:rtl}

.panel{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);max-height:calc(100vh - 24px - env(safe-area-inset-top,0px));overflow:auto}
.panel .empty{padding:20px;color:var(--muted)}
.panel .empty b{color:var(--ink)}
.ph{padding:16px 18px 12px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px;position:relative}
.ph .big{font-family:var(--quran);font-size:2.6rem;line-height:1.7;text-align:center;direction:rtl;background:var(--paper);border-radius:8px;border:1px solid var(--line)}
.ph .ref{color:var(--muted);font-size:.9rem;text-align:center}
.close{display:none;position:absolute;top:8px;right:10px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:2px 10px}
.sec{padding:14px 18px;border-bottom:1px solid var(--line)}
.sec:last-child{border-bottom:0}
.sec h3{margin:0 0 9px;font-size:.76rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.sg{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;align-items:start;padding:8px 0;border-top:1px dashed var(--line)}
.sg:first-of-type{border-top:0;padding-top:0}
.sg .seg-ar{font-family:var(--quran);font-size:1.7rem;line-height:1.5;direction:rtl;min-width:3.2rem;text-align:center;background:var(--paper);border-radius:6px;padding:0 8px;border:1px solid var(--line)}
.sg .nm{font-weight:700;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.sg .nm i{width:11px;height:11px;border-radius:50%;display:inline-block}
.sg .nm .ar{font-weight:400;font-size:1.1rem;color:var(--muted)}
.sg .hk{display:inline-block;font-size:.78rem;border:1px solid var(--line);border-radius:999px;padding:0 8px;color:var(--muted)}
.ql{display:flex;flex-direction:column;gap:3px;margin-top:8px;padding:8px 10px;border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:6px;background:var(--bg)}
.ql .qlh{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
.ql a{color:var(--accent);font-size:.88rem;font-weight:600;text-decoration:none}
.ql a:hover{text-decoration:underline}
.ql .qbtn{border:0;background:transparent;padding:2px 0;text-align:left;color:var(--accent);font-size:.88rem;font-weight:600;cursor:pointer}
.ql .qbtn:hover{text-decoration:underline}
.ql .qlh2{margin-top:6px}
.ql .qapp{color:var(--accent);font-size:.85rem;font-weight:600;text-decoration:none;padding:2px 0}
.ql .qapp:hover{text-decoration:underline}
/* Pembaca Qaidaty di dalam mushaf */
[hidden]{display:none!important}
.qv-scrim{position:fixed;inset:0;background:rgba(5,15,10,.55);z-index:50}
.qv{position:fixed;z-index:51;top:calc(env(safe-area-inset-top,0px) + 3vh);bottom:calc(env(safe-area-inset-bottom,0px) + 3vh);left:50%;transform:translateX(-50%);width:min(860px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden}
.qv-h{display:flex;align-items:flex-start;gap:10px;padding:14px 18px 10px;border-bottom:1px solid var(--line)}
.qv-h .t{flex:1;min-width:0}
.qv-h .eb{font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);font-weight:700}
.qv-h h2{margin:2px 0 0;font-size:1.15rem;line-height:1.3;text-wrap:balance}
.qv-tabs{display:flex;gap:6px;overflow-x:auto;padding:8px 18px;border-bottom:1px solid var(--line)}
.qv-tabs button{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 11px;font-size:.84rem;color:var(--muted)}
.qv-tabs button[aria-current="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.qv-b{overflow:auto;padding:14px 22px 22px;line-height:1.65;flex:1}
.qv-b h3.pt{margin:0 0 2px;font-size:1.3rem}
.qv-b .src{color:var(--muted);font-size:.85rem;margin-bottom:10px}
.qv-b h4{margin:18px 0 6px;font-size:1.02rem}
.qv-b p{margin:8px 0;max-width:68ch}
.qv-b .ar{font-family:var(--ar);direction:rtl;unicode-bidi:isolate;font-size:1.3em;line-height:1.7}
.qv-b ul,.qv-b ol{padding-left:1.3rem;max-width:68ch}
.qv-b .tw{overflow-x:auto;margin:12px 0;border:1px solid var(--line);border-radius:8px}
.qv-b table{border-collapse:collapse;width:100%;font-size:.92rem}
.qv-b caption{caption-side:top;text-align:left;padding:6px 10px;color:var(--muted);font-size:.82rem}
.qv-b th{background:var(--accent);color:var(--accent-ink);padding:6px 9px;text-align:left;font-weight:600}
.qv-b td{padding:6px 9px;border-top:1px solid var(--line);vertical-align:middle}
.qv-b .co{border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:6px;padding:8px 12px;margin:12px 0;background:var(--bg);max-width:68ch}
.qv-b .co .k{display:block;font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);font-weight:700}
.qv-b .co p{margin:4px 0}
.qv-b .arbox{border:1px solid var(--line);border-radius:8px;padding:10px;text-align:center;margin:12px 0;background:var(--bg)}
.qv-b .arbox .ar{font-size:1.7rem;line-height:2}
.qv-b .eq{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;margin:12px 0}
.qv-b .eq .c{padding:6px 14px;border:1.5px solid var(--accent);border-radius:999px}
.qv-b .eq .op{font-size:1.4rem;color:var(--accent)}
.qv-b .words{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.qv-b .words span{border:1px solid var(--line);border-radius:6px;padding:0 8px;font-family:var(--ar);font-size:1.25rem;line-height:1.7;direction:rtl}
.qv-b details{border:1px solid var(--line);border-radius:8px;margin:12px 0}
.qv-b details>summary{padding:7px 12px;cursor:pointer;font-weight:600}
.qv-b details .words{padding:0 12px 10px}
.qv-b .bagan{margin:14px 0;padding:12px;border:1px solid var(--line);border-radius:10px;text-align:center}
.qv-b .broot{display:inline-block;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:5px 14px;font-weight:700}
.qv-b .bbr{display:grid;grid-template-columns:repeat(auto-fit,minmax(9rem,1fr));gap:8px;margin-top:10px;text-align:left}
.qv-b .bnode{border:1px solid var(--line);border-top:3px solid var(--accent);border-radius:6px;padding:6px 9px;min-width:0}
.qv-b .bnode b{color:var(--accent)}
.qv-b .bnode ul{margin:4px 0 0;padding-left:1rem;font-size:.9rem}
.qv-b ol.steps{text-align:left;max-width:30rem;margin:10px auto 0}
.qv-f{display:flex;align-items:center;gap:8px;justify-content:space-between;padding:10px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
.qv-f a{color:var(--muted);font-size:.85rem}
@media (max-width:640px){.qv-f a{order:3;flex-basis:100%;text-align:center}.qv{top:env(safe-area-inset-top,0px);bottom:0;width:100vw;border-radius:0;border:0}.qv-b{padding:12px 16px 20px}}
.ql.inl{background:transparent;margin-top:10px}
.hk.qr,.tag.qr{color:var(--accent);border-color:var(--accent)}
.ulg{border-bottom:3px solid var(--ul);padding-bottom:1px;white-space:nowrap}
.ulg.sug{border-bottom-style:dashed;border-bottom-width:2px}
.ln .ulg{display:inline}
.ulnote{margin:-4px 0 10px}
.ulk{border-bottom:3px solid var(--ul);padding:0 2px}
.ulk.sug{border-bottom-style:dashed}
.kjtext{font-family:var(--quran);font-size:1.5rem;line-height:2;direction:rtl;text-align:center;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:2px 8px;margin-bottom:6px}
.kjsec p{margin:6px 0;font-size:.92rem}
details.rinci{margin-top:10px;border-top:1px dashed var(--line);padding-top:6px}
details.rinci summary{cursor:pointer;color:var(--muted);font-size:.88rem}
.mini{display:flex;align-items:center;gap:10px;padding:3px 0;font-size:.9rem}
.mini .seg-ar{font-family:var(--quran);font-size:1.4rem;background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:0 8px;min-width:3rem;text-align:center;direction:rtl}
.ubox{border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:10px;background:var(--surface)}
.uhead{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;margin-bottom:6px}
.pickbar{background:var(--accent-soft)}
.pickbar .err{color:var(--bad);margin-top:6px}
.sep{color:var(--muted);margin:0 2px}
.sg p{margin:3px 0 0;font-size:.9rem;color:var(--muted)}
.sg .orig{font-size:.82rem;color:var(--accent)}
.irab{width:100%;border-collapse:collapse}
.irab td{padding:5px 6px;border-bottom:1px solid var(--line);vertical-align:middle;font-size:.9rem}
.irab td.k{font-family:var(--quran);font-size:1.35rem;direction:rtl;text-align:right;white-space:nowrap;background:var(--paper);line-height:1.6}
.irab tr.me td{background:var(--accent-soft)}
.irab tr.me td.k{background:var(--paper)}
.irab tr{cursor:pointer}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-inline-end:5px;vertical-align:0}
.edbox{background:var(--accent-soft)}
.fld{display:flex;flex-direction:column;gap:4px;margin-bottom:8px;min-width:0}
.fld>label{font-size:.85rem;color:var(--muted)}
.fld select,.fld textarea,.fld input{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 9px;width:100%;min-width:0}
.fld textarea{min-height:3.6rem;resize:vertical}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.msg{color:var(--accent);font-size:.9rem}

/* Panduan */
.guide{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:14px}
.gc{padding:14px 16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.gc header{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.gc header i{width:14px;height:14px;border-radius:50%;display:inline-block}
.gc h2{margin:0;font-size:1.05rem}
.gc header .ar{margin-inline-start:auto;font-size:1.3rem;color:var(--accent)}
.gc p{margin:0;font-size:.93rem}
.gc .tag{display:inline-block;font-size:.78rem;border:1px solid var(--line);border-radius:999px;padding:0 8px;color:var(--muted);width:fit-content}
.ex{display:flex;flex-wrap:wrap;gap:6px;direction:rtl}
.ex button{border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:0 8px;font-family:var(--quran);font-size:1.2rem;line-height:1.7;color:var(--paper-ink)}
.ex button small{font-family:var(--ui);font-size:.72rem;color:var(--paper-mut);margin-inline-start:4px}
.intro{padding:16px 18px;margin-bottom:14px;max-width:80ch}
.intro p{margin:0 0 8px}
.intro p:last-child{margin:0}

/* Statistik */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.tile{padding:12px 14px}
.tile b{display:block;font-size:1.6rem;font-variant-numeric:tabular-nums;line-height:1.2}
.tile span{color:var(--muted);font-size:.88rem}
.bars{padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.bars h2{margin:0 0 6px;font-size:1rem}
.brow{display:grid;grid-template-columns:11em minmax(0,1fr) 4.5em;gap:10px;align-items:center;font-size:.9rem;cursor:pointer;border-radius:6px}
.brow:hover{background:var(--accent-soft)}
.brow .track{background:var(--bg);border-radius:4px;height:14px;overflow:hidden}
.brow .fill{height:100%;border-radius:4px}
.brow .v{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.brow .lb{display:flex;align-items:center;gap:6px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Latihan */
.quiz{max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.qhead{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between}
.score{display:flex;gap:14px;font-variant-numeric:tabular-nums;color:var(--muted)}
.score b{color:var(--ink)}
.qcard{padding:18px}
.qtext{background:var(--paper);color:var(--paper-ink);border:1px solid var(--paper-rule);border-radius:8px;padding:12px 16px;font-family:var(--quran);font-size:clamp(1.3rem,3.4vw,1.9rem);line-height:2.2;direction:rtl;text-align:center}
.qtext .tgt{background:var(--hl-bg);box-shadow:0 0 0 2px var(--hl);border-radius:5px;padding:0 3px}
.qtext .tgt.rev{background:transparent}
.qref{color:var(--muted);font-size:.88rem;text-align:center;margin-top:6px}
.qprompt{font-weight:600;margin:14px 0 10px}
.qprompt .ar{font-family:var(--quran);font-size:1.5rem;font-weight:400}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.opt{display:flex;align-items:center;gap:9px;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;font-weight:600}
.opt i{width:12px;height:12px;border-radius:50%;flex:none}
.opt .ar{margin-inline-start:auto;font-weight:400;color:var(--muted)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.fb{margin-top:12px;padding:10px 12px;border-radius:8px;font-size:.93rem}
.fb.ok{background:var(--ok-soft)}
.fb.no{background:var(--bad-soft)}

/* Edit */
.tblwrap{overflow-x:auto}
table.list{border-collapse:collapse;width:100%}
table.list th,table.list td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
table.list th{font-size:.76rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
table.list td .q{font-family:var(--quran);font-size:1.3rem;line-height:1.6;background:var(--paper);color:var(--paper-ink);padding:0 6px;border-radius:5px}

@media (max-width:920px){
  .layout{grid-template-columns:minmax(0,1fr)}
  .panel{position:fixed;left:0;right:0;bottom:0;top:auto;max-height:70vh;border-radius:14px 14px 0 0;box-shadow:var(--shadow);z-index:20;padding-bottom:env(safe-area-inset-bottom,0px);transform:translateY(105%);transition:transform .2s}
  .panel.open{transform:none}
  .close{display:block}
  .brow{grid-template-columns:8.5em minmax(0,1fr) 3.8em}
}
@media (prefers-reduced-motion:reduce){.panel{transition:none}.w.flash{animation:none}}

var C=[
 {n:'Mubtada\'',a:'المُبْتَدَأ',h:'marfū\'',d:'Isim yang menjadi pangkal jumlah ismiyyah dan disandari khabar. Umumnya ma\'rifah dan terletak di awal kalimat.'},
 {n:'Inna & saudaranya + isimnya',a:'إنّ وأخواتها مع اسمها',h:'harf mabnī + isim manṣūb',d:'Harf nashab إنّ، أنّ، كأنّ، لكنّ، ليت، لعلّ bersama isimnya diberi satu warna, seperti kāna dan isimnya. Inna menashabkan isim dan merafa\'kan khabar. Dhamir yang bersambung dengan inna (إِنَّهُۥ، إِنَّا) adalah isimnya. Warna ini juga dipakai untuk لا النافية للجنس dan isimnya (لَا رَيۡبَ), karena ia beramal seperti إنّ. إنّما (inna kāffah) tidak beramal, jadi tidak diberi warna ini.'},
 {n:'Khabar',a:'الخَبَر',h:'marfū\'',d:'Bagian yang menyempurnakan makna mubtada\'. Bisa berupa kata tunggal, jumlah, atau syibh jumlah (jar-majrur / zharaf) yang muta\'allaq dengan khabar yang dibuang.'},
 {n:'Khabar inna & saudaranya',a:'خبرُ إنّ وأخواتها',h:'marfū\'',d:'Khabar dari jumlah yang dimasuki إنّ dan saudara-saudaranya. Inna menashabkan isim dan merafa\'kan khabar.'},
 {n:'Khabar kāna & saudaranya',a:'خبرُ كان وأخواتها',h:'manṣūb',d:'Khabar dari fi\'il nāqiṣ: كان، أصبح، أضحى، أمسى، ظلّ، بات، صار، ليس، ما زال، ما فتئ، ما برح، ما انفكّ، ما دام. Kāna merafa\'kan isim dan menashabkan khabar.'},
 {n:'Fā\'il / Nā\'ib al-fā\'il',a:'الفاعل / نائب الفاعل',h:'marfū\'',d:'Fā\'il: isim yang disebut setelah fi\'il ma\'lūm sebagai pelaku. Nā\'ib al-fā\'il: isim yang menggantikan fā\'il setelah fi\'il majhūl.'},
 {n:'Kāna & saudaranya + isimnya',a:'كان وأخواتها مع اسمها',h:'fi\'il nāqiṣ + isim marfū\'',d:'Fi\'il nāqiṣ bersama isimnya (sering berupa dhamir yang bersambung, seperti كَانُوا، كُنتُمۡ). Isim kāna hukumnya marfū\'.'},
 {n:'Maf\'ūl bih',a:'المَفْعُول بِه',h:'manṣūb',d:'Isim yang dikenai perbuatan fā\'il. Bisa berupa isim zhahir atau dhamir yang bersambung dengan fi\'il (seperti ـهُمۡ pada رَزَقۡنَٰهُمۡ).'},
 {n:'Maf\'ūl fīh (zharaf)',a:'المفعول فيه / الظَّرْف',h:'manṣūb',d:'Zharaf zaman atau makan yang menerangkan waktu atau tempat terjadinya perbuatan, mengandung makna فِي. Contoh: إِذَا، عِندَ، حَيۡثُ، بَيۡنَ.'},
 {n:'Maf\'ūl muṭlaq',a:'المفعول المُطْلَق',h:'manṣūb',d:'Mashdar (atau penggantinya) yang disebut setelah fi\'il dari lafazh yang sama atau semakna, untuk menguatkan, menerangkan jenis, atau bilangan perbuatan.'},
 {n:'Maf\'ūl li-ajlih',a:'المفعول لأجله',h:'manṣūb',d:'Mashdar yang menjelaskan sebab terjadinya perbuatan, menjawab pertanyaan لِمَ؟ Contoh: حَذَرَ ٱلۡمَوۡتِ، حَسَدٗا.'},
 {n:'Maf\'ūl ma\'ah',a:'المفعول معه',h:'manṣūb',d:'Isim yang terletak setelah wawu yang bermakna مَعَ (wawu ma\'iyyah), menunjukkan sesuatu yang menyertai perbuatan.'},
 {n:'Ḥāl',a:'الحَال',h:'manṣūb',d:'Isim nakirah yang menerangkan keadaan shāḥib al-ḥāl ketika perbuatan terjadi, menjawab pertanyaan كَيۡفَ؟'},
 {n:'Tamyīz',a:'التَّمْيِيز',h:'manṣūb',d:'Isim nakirah yang menghilangkan kesamaran pada dzat (bilangan, takaran) atau pada nisbah dalam kalimat.'},
 {n:'Munādā',a:'المُنَادَى',h:'manṣūb / mabnī',d:'Isim yang dipanggil dengan huruf nidā\' (disebut atau dibuang). Manṣūb bila mudhāf, syibh mudhāf, atau nakirah ghairu maqṣūdah; mabnī \'alā mā yurfa\'u bih bila mufrad \'alam atau nakirah maqṣūdah.'},
 {n:'Mustatsnā',a:'المُسْتَثْنَى',h:'menurut jenis kalimat',d:'Isim setelah إلّا atau saudaranya. Manṣūb dalam kalām tāmm mūjab; dalam kalām manfī boleh mengikuti badal; dalam kalām nāqiṣ (mufarragh) di-i\'rab sesuai kedudukannya.'},
 {n:'Mudhāf ilaih',a:'المُضَاف إليه',h:'majrūr',d:'Isim yang disandarkan kepadanya isim sebelumnya (mudhāf), selalu majrūr. Termasuk dhamir yang bersambung dengan isim, seperti ـهِمۡ pada قُلُوبِهِمۡ.'},
 {n:'Fi\'il + fā\'il / nā\'ib fā\'il',a:'الفعل مع فاعله / نائبه',h:'fi\'il: mabnī / mu\'rab',d:'Kata kerja yang fā\'il atau nā\'ib fā\'il-nya terkandung di dalamnya (dhamir mustatir atau bāriz yang bersambung). Fi\'il māḍī dan amr mabnī; muḍāri\' marfū\', manṣūb, atau majzūm.'},
 {n:'Jar-majrūr',a:'الجارّ والمجرور',h:'majrūr',d:'Huruf jar beserta isim yang dijarkannya (syibh jumlah). Ia muta\'allaq dengan fi\'il atau yang semakna dengannya.'},
 {n:'Ma\'ṭūf / \'aṭaf',a:'المَعْطُوف',h:'mengikuti ma\'ṭūf \'alaih',d:'Kata setelah huruf \'aṭaf (و، ف، ثمّ، أو، أم، بل، لا، لكن، حتى) yang mengikuti i\'rab kata sebelumnya. Termasuk jumlah yang di-\'aṭaf-kan.'},
 {n:'Na\'at',a:'النَّعْت',h:'mengikuti man\'ūt',d:'Tābi\' yang menyifati isim sebelumnya, mengikutinya dalam i\'rab, ta\'rīf-tankīr, mudzakkar-mu\'annats, dan bilangan.'},
 {n:'Badal',a:'البَدَل',h:'mengikuti mubdal minhu',d:'Tābi\' yang menjadi maksud hukum tanpa perantara: badal kull min kull, ba\'dh min kull, isytimāl, atau mubāyin.'},
 {n:'Taukīd',a:'التَّوْكِيد',h:'mengikuti mu\'akkad',d:'Tābi\' yang menguatkan makna: lafzhī (pengulangan) atau ma\'nawī (نَفۡس، عَيۡن، كُلّ، جَمِيع، أَجۡمَعُونَ).'},
 {n:'Tanpa warna (lā & mā nafi)',a:'لا وما النافيتان',h:'harf mabnī',d:'Harf nafi لَا dan مَا (termasuk مَا ḥijāziyyah dan لَا yang menguatkan nafi, seperti وَلَا ٱلضَّآلِّينَ) sengaja dibiarkan tanpa warna. Pengecualian: لَا nāfiyah lil jins diberi warna inna dan isimnya, sedangkan لَا nāhiyah diberi warna amil jazim.'},
 {n:'Amil nashab muḍāri\'',a:'نواصب المضارع',h:'harf mabnī',d:'Harf yang menashabkan fi\'il muḍāri\': أَنۡ (mashdariyah), لَنۡ، كَيۡ، lām ta\'līl (لِ kay) dan حَتَّىٰ yang diikuti muḍāri\' manṣūb, serta fā\' sababiyyah. أَنۡ yang diikuti fi\'il māḍī atau أَنۡ mukhaffafah tidak masuk warna ini.'},
 {n:'Amil jazim',a:'جوازم المضارع',h:'harf mabnī',d:'Harf yang menjazmkan fi\'il muḍāri\': لَمۡ، لَمَّا، lām al-amr (فَلۡيَعۡبُدُواْ), لَا al-nāhiyah (لَا تُطِعۡهُ), dan إِنۡ syarṭiyyah. Isim syarat (مَنۡ، مَا، أَيۡنَمَا) tetap diberi warna sesuai kedudukannya sebagai isim.'},
 {n:'Harf \'aṭaf',a:'حروف العطف',h:'harf mabnī',d:'Huruf yang menghubungkan ma\'ṭūf dengan ma\'ṭūf \'alaih: و، ف، ثُمَّ، أَوۡ، أَمۡ. Wawu/fā\' yang bersambung dengan kata kini dipisah warnanya dari kata ma\'ṭūf sesudahnya.'},
 {n:'Harf lainnya',a:'حروف المعاني الأخرى',h:'harf mabnī',d:'Huruf ma\'ānī lain yang tidak memiliki kedudukan i\'rab: wawu/fā\' isti\'nāf, ḥāliyah dan rābiṭah jawab, lām taukīd/ibtidā\', qad, sawfa, hamzah dan hal istifhām, illā, kallā, bal, yā nidā\' dan hā\' tanbīh, inna kāffah (إِنَّمَا), مَا zā\'idah dan mashdariyah, إِنۡ nafiyah, ḥurūf muqaṭṭa\'ah (الٓمٓ), dan sejenisnya. Lā dan mā nafi tidak termasuk di sini; keduanya tanpa warna.'}

  var w=WORDS[state.sel]; if(!w||!state.db) return;

  else { var doc=nowMeta({sg:sg,n:note,w:w.txt,s:w.s,a:w.a,p:w.p+1,o:w.osg}); queue(function(){return ref.set(doc)}); }

  state.hi=-1;

/* ---------- latihan ---------- */
var Q={right:0,wrong:0,streak:0,cur:null,scope:'all',done:false};
function pool(){
  var base=Q.scope==='page'?TEXTW.filter(function(w){return w.p===state.page-1}):TEXTW;
  var out=[];base.forEach(function(w){w.sg.forEach(function(s,si){var c=effCat(w,si);if(c!==NONE&&w.a)out.push([w,si,c])})});
  return out;
}
function newQ(){
  var P=pool(); if(!P.length){Q.cur=null;renderLatihan();return}
  var pick=P[Math.floor(Math.random()*P.length)];
  var present={};P.forEach(function(x){present[x[2]]=1});
  var others=Object.keys(present).map(Number).filter(function(c){return c!==pick[2]});
  if(others.length<3) for(var c=0;c<C.length;c++) if(c!==NONE) if(c!==pick[2]&&others.indexOf(c)<0) others.push(c);
  others.sort(function(){return Math.random()-.5});
  var opts=[pick[2]].concat(others.slice(0,3)).sort(function(){return Math.random()-.5});
  Q.cur={w:pick[0],si:pick[1],c:pick[2],opts:opts,ans:null}; Q.done=false; renderLatihan();
}
function renderLatihan(){
  var h='<div class="quiz"><div class="qhead"><div class="seg" role="group" aria-label="Cakupan soal"><button data-qs="all" aria-pressed="'+(Q.scope==='all')+'">Seluruh mushaf</button><button data-qs="page" aria-pressed="'+(Q.scope==='page')+'">Halaman '+state.page+' saja</button></div><div class="score"><span>Benar <b>'+Q.right+'</b></span><span>Salah <b>'+Q.wrong+'</b></span><span>Beruntun <b>'+Q.streak+'</b></span></div></div>';
  var q=Q.cur;
  if(!q){$('v-latihan').innerHTML=h+'<div class="card qcard"><p class="hint">Tidak ada kata berwarna pada cakupan ini.</p></div></div>';return}
  var aw=AYW[q.w.s+':'+q.w.a]||[q.w];
  var txt=aw.map(function(x){
    if(x.i!==q.w.i) return '<span>'+(q.ans!=null?segHtml(x):esc(x.txt))+'</span>';
    return '<span>'+x.sg.map(function(s,si){
      var col=q.ans!=null?' style="color:'+kc(effCat(x,si))+'"':'';
      return si===q.si?'<span class="tgt'+(q.ans!=null?' rev':'')+'"'+col+'>'+esc(s[0])+'</span>':'<span'+col+'>'+esc(s[0])+'</span>';
    }).join('')+'</span>';
  }).join(' ')+' <span style="color:var(--paper-num)">﴿'+adig(q.w.a)+'﴾</span>';
  h+='<div class="card qcard"><div class="qtext" dir="rtl">'+txt+'</div><div class="qref">'+SURAH[q.w.s]+' : '+q.w.a+' · halaman '+(q.w.p+1)+'</div>';
  h+='<div class="qprompt">Apa kedudukan i\'rab <span class="ar">'+esc(q.w.sg[q.si][0])+'</span> yang disorot?</div><div class="opts">';
  q.opts.forEach(function(c){
    var cl='opt'; if(q.ans!=null){ if(c===q.c) cl+=' right'; else if(c===q.ans) cl+=' wrong'; }
    h+='<button class="'+cl+'" data-ans="'+c+'"'+(q.ans!=null?' disabled':'')+'>'+(q.ans!=null?'<i style="background:'+kc(c)+'"></i>':'')+esc(C[c].n)+'<span class="ar">'+esc(C[c].a)+'</span></button>';
  });
  h+='</div>';
  if(q.ans!=null){
    var ok=q.ans===q.c;
    h+='<div class="fb '+(ok?'ok':'no')+'"><b>'+(ok?'Benar.':'Belum tepat.')+'</b> '+esc(C[q.c].n)+' ('+esc(C[q.c].h)+'): '+esc(C[q.c].d)+qlinks(q.c,'inl')+'</div>';
    h+='<div class="row" style="margin-top:12px"><button class="btn pri" id="qnextq">Soal berikutnya</button><button class="btn" data-go="'+q.w.i+'">Lihat di mushaf</button></div>';
  }
  $('v-latihan').innerHTML=h+'</div></div>';
}

  rows.sort(function(a,b){return a.wi-b.wi});
  h+='<div class="card intro" style="max-width:none"><h2 style="margin:0 0 6px;font-size:1.05rem">Kata yang diedit · '+fmt(rows.length)+'</h2>';
  if(rows.length) h+='<div class="tblwrap"><table class="list"><thead><tr><th>Ayat</th><th>Kata</th><th>Sekarang</th><th>Catatan</th><th></th></tr></thead><tbody>'+rows.map(function(r){return '<tr><td>'+(r.s?SURAH[r.s]+' '+r.a:'')+'</td><td><button class="btn sm" data-go="'+r.wi+'"><span class="q">'+esc(r.w||'')+'</span></button></td><td><span class="q">'+r.now+'</span></td><td>'+esc(r.n)+'</td><td><button class="btn sm" data-del="'+esc(r.kind+'/'+r.id)+'">Hapus</button></td></tr>'}).join('')+'</tbody></table></div>'; else h+='<p class="hint">Belum ada kata yang diedit.</p>';
  $('v-edit').innerHTML=h+'</div>';
}

/* ---------- pembaca Qaidaty Jilid 2 ---------- */
var QD=JSON.parse(document.getElementById('qdata').textContent);
var qv={ch:0,pg:0,last:null};
var AR_RE=/[؀-ۿݐ-ݿﭐ-﷿ﹰ-﻿]+(?:[\s،؛؟.,()\-–\/:ـ#]+[؀-ۿݐ-ݿﭐ-﷿ﹰ-﻿]+)*/g;
function rich(s){return esc(s).replace(AR_RE,function(m){return '<span class="ar" lang="ar" dir="rtl">'+m+'</span>'}).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>')}
function qBlock(b){
  switch(b.t){
  case 'p':return '<p>'+rich(b.x)+'</p>';
  case 'h':return '<h4>'+rich(b.x)+'</h4>';
  case 'l':var tg=b.o?'ol':'ul';return '<'+tg+'>'+b.x.map(function(i){return '<li>'+rich(i)+'</li>'}).join('')+'</'+tg+'>';
  case 'ar':return '<div class="arbox"><div class="ar" lang="ar" dir="rtl">'+esc(b.x)+'</div>'+(b.g?'<div>'+rich(b.g)+'</div>':'')+'</div>';
  case 'co':if(b.k==='edit') return '';var lab={aturan:'Aturan',catatan:'Catatan',rumus:'Rumus'}[b.k]||'Catatan';
    return '<div class="co"><span class="k">'+lab+'</span>'+[].concat(b.x).map(function(x){return '<p>'+rich(x)+'</p>'}).join('')+'</div>';
  case 't':return '<div class="tw"><table>'+(b.cap?'<caption>'+rich(b.cap)+'</caption>':'')+'<thead><tr>'+b.h.map(function(h){return '<th>'+rich(h)+'</th>'}).join('')+'</tr></thead><tbody>'+b.r.map(function(r){return '<tr>'+r.map(function(c){return '<td>'+rich(c)+'</td>'}).join('')+'</tr>'}).join('')+'</tbody></table></div>';
  case 'eq':return '<div class="eq">'+b.items.map(function(x,i){return i%2?'<span class="op">'+esc(x)+'</span>':'<span class="c">'+rich(x)+'</span>'}).join('')+'</div>';
  case 'v':return '<details><summary>'+rich(b.title)+' ('+b.items.length+' contoh)</summary><div class="words">'+b.items.map(function(w){return '<span lang="ar">'+esc(w[0])+'</span>'}).join('')+'</div></details>';
  case 'w':return '<div class="words">'+b.x.map(function(w){return '<span lang="ar">'+esc(Array.isArray(w)?w[0]:w)+'</span>'}).join('')+'</div>';
  }return '';
}
function qBagan(b){
  if(!b) return '';
  if(b.t==='bf') return '<figure class="bagan"><div class="broot">'+rich(b.root)+'</div><ol class="steps">'+b.steps.map(function(s){return '<li>'+rich(s)+'</li>'}).join('')+'</ol></figure>';
  return '<figure class="bagan"><div class="broot">'+rich(b.root)+'</div><div class="bbr">'+b.br.map(function(x){return '<div class="bnode"><b>'+rich(x[0])+'</b><ul>'+x[1].map(function(i){return '<li>'+rich(i)+'</li>'}).join('')+'</ul></div>'}).join('')+'</div></figure>';
}
function qOpen(anchor){
  var m=/^b(\d+)-m(\d+)$/.exec(anchor||''); if(!m) return;
  var ci=QD.findIndex(function(c){return c.no===+m[1]}); if(ci<0) return;
  qv.ch=ci; qv.pg=Math.min(+m[2]-1,QD[ci].pages.length-1);
  if($('qv').hidden) qv.last=document.activeElement;
  qRender(); $('qv').hidden=false; $('qvs').hidden=false; $('qv-close').focus();
}
function qClose(){$('qv').hidden=true;$('qvs').hidden=true; if(qv.last&&qv.last.focus) try{qv.last.focus()}catch(e){}}
function qRender(){
  var c=QD[qv.ch], p=c.pages[qv.pg];
  var flat=[];QD.forEach(function(cc,i){cc.pages.forEach(function(_,j){flat.push([i,j])})});
  var k=flat.findIndex(function(x){return x[0]===qv.ch&&x[1]===qv.pg});
  var h='<div class="qv-h"><div class="t"><div class="eb">Qaidaty Jilid 2 · Bab '+c.no+' · hlm '+esc(c.hlm)+'</div><h2 id="qv-title">'+rich(c.title)+'</h2></div><button class="btn sm" id="qv-close">Kembali ke mushaf</button></div>';
  h+='<div class="qv-tabs" role="group" aria-label="Materi bab ini">'+c.pages.map(function(pp,j){return '<button data-qp="'+j+'" aria-current="'+(j===qv.pg)+'">'+(j+1)+'. '+esc(pp.title)+'</button>'}).join('')+'</div>';
  h+='<div class="qv-b" id="qv-b"><h3 class="pt">'+rich(p.title)+'</h3><div class="src">Naskah Qaidaty '+esc(p.src||'')+'</div>'+p.b.map(qBlock).join('')+(p.bg?'<h4>Bagan</h4>'+qBagan(p.bg):'')+'</div>';
  h+='<div class="qv-f"><button class="btn" data-qn="-1"'+(k<=0?' disabled':'')+'>‹ Materi sebelumnya</button><a href="'+qAppUrl(qUnit(c.no,qv.pg+1),'latihan')+'" target="_blank" rel="noopener">'+(qUnit(c.no,qv.pg+1)?'Latihan & asesmen BAB '+qUnit(c.no,qv.pg+1)+' di aplikasi Qaidaty ↗':'Buka aplikasi Qaidaty ↗')+'</a><button class="btn" data-qn="1"'+(k>=flat.length-1?' disabled':'')+'>Materi berikutnya ›</button></div>';
  $('qv').innerHTML=h; var b=$('qv-b'); if(b) b.scrollTop=0; var ct=document.querySelector('.qv-tabs [aria-current="true"]'); if(ct){var tb=ct.parentNode; tb.scrollLeft=ct.offsetLeft-tb.offsetLeft-16;}
}
function qStep(d){
  var flat=[];QD.forEach(function(cc,i){cc.pages.forEach(function(_,j){flat.push([i,j])})});
  var k=flat.findIndex(function(x){return x[0]===qv.ch&&x[1]===qv.pg})+d;
  if(k<0||k>=flat.length) return; qv.ch=flat[k][0]; qv.pg=flat[k][1]; qRender();
}
/* ---------- tab & navigasi ---------- */
function setTab(t){
  state.tab=t;
  document.querySelectorAll('.tab').forEach(function(b){b.setAttribute('aria-selected',String(b.getAttribute('data-tab')===t))});
  ['baca','panduan','latihan','stat','edit'].forEach(function(v){$('v-'+v).hidden=(v!==t)});
  if(t==='panduan') renderPanduan();
  if(t==='latihan'){ if(!Q.cur) newQ(); else renderLatihan(); }
  if(t==='stat') renderStat();
  if(t==='edit') renderEdit();
}
function goWord(i){ setTab('baca'); showWord(+i,{flash:true}); }

document.addEventListener('click',function(ev){
  var t=ev.target, el;
  if((el=t.closest('.tab'))){setTab(el.getAttribute('data-tab'));return}
  if((el=t.closest('.w'))&&!el.closest('.panel')){var wi=+el.getAttribute('data-i');
    if(state.pick&&state.pick.b==null){var a=WORDS[state.pick.a],b=WORDS[wi];
      if(b.s!==a.s||b.a!==a.a){alertMsg('Kata terakhir harus berada dalam ayat yang sama.');return}
      if(wi<state.pick.a){state.pick.b=state.pick.a;state.pick.a=wi}else state.pick.b=wi;
      showWord(state.pick.a);return}
    showWord(wi);return}
  if((el=t.closest('[data-go]'))){goWord(el.getAttribute('data-go'));return}
  if((el=t.closest('.lg'))){var c=+el.getAttribute('data-c');state.filter[c]=!state.filter[c];renderLegend();renderPage();if(state.sel!=null)showWord(state.sel);return}
  if(t.id==='fclear'){state.filter={};renderLegend();renderPage();if(state.sel!=null)showWord(state.sel);return}
  if((el=t.closest('[data-fc]'))){state.filter={};state.filter[+el.getAttribute('data-fc')]=true;setTab('baca');renderLegend();renderPage();return}
  if(t.id==='pclose'){$('panel').classList.remove('open');return}
  if((el=t.closest('[data-q]'))){qOpen(el.getAttribute('data-q'));return}
  if(t.id==='qv-close'||t.id==='qvs'){qClose();return}
  if((el=t.closest('[data-qp]'))){qv.pg=+el.getAttribute('data-qp');qRender();return}
  if((el=t.closest('[data-qn]'))){qStep(+el.getAttribute('data-qn'));return}
  if((el=t.closest('[data-ans]'))){answer(+el.getAttribute('data-ans'));return}
  if(t.id==='qnextq'){newQ();return}
  if((el=t.closest('[data-qs]'))){Q.scope=el.getAttribute('data-qs');newQ();return}
  if(t.id==='ed-save'){saveEditor();return}
  if(t.id==='ed-reset'){resetWord();return}
  if(t.id==='pk-start'){state.pick={a:state.sel,b:null};state.form=null;showWord(state.sel);return}
  if(t.id==='pk-cancel'){state.pick=null;showWord(state.sel);return}
  if(t.id==='uf-save'){saveUnitForm(t.getAttribute('data-uid'));return}
  if((el=t.closest('[data-uok]'))){unitOk(el.getAttribute('data-uok'));return}
  if((el=t.closest('[data-uno]'))){unitNo(el.getAttribute('data-uno'));return}
  if((el=t.closest('[data-uedit]'))){var id=el.getAttribute('data-uedit');state.form=(state.form&&state.form.id===id)?null:{id:id};showWord(state.sel);return}
  if((el=t.closest('[data-del]'))){var ref=state.db&&state.db.doc(el.getAttribute('data-del'));if(ref)queue(function(){return ref.delete()});return}
});
document.addEventListener('input',function(ev){if(ev.target.id==='ed-split')onSplitInput()});
function alertMsg(m){var el=$('panel').querySelector('.pickbar');if(el){var s=el.querySelector('.err');if(!s){s=document.createElement('div');s.className='err';el.appendChild(s)}s.textContent=m}}
document.addEventListener('keydown',function(ev){
  if(!$('qv').hidden){ if(ev.key==='Escape'){qClose()} return; }
  var el=ev.target.closest&&ev.target.closest('.w');
  if(el&&(ev.key==='Enter'||ev.key===' ')){ev.preventDefault();showWord(+el.getAttribute('data-i'));return}
  if(state.tab!=='baca'||/INPUT|SELECT|TEXTAREA/.test(ev.target.tagName)) return;
  if(ev.key==='ArrowLeft'){gotoPage(state.page+1)} else if(ev.key==='ArrowRight'){gotoPage(state.page-1)}
});
$('pnext').onclick=function(){gotoPage(state.page+1)};
$('pprev').onclick=function(){gotoPage(state.page-1)};
$('psel').innerHTML=PAGES.map(function(_,i){return '<option value="'+(i+1)+'">'+(i+1)+'</option>'}).join('');
$('psel').onchange=function(){gotoPage(+this.value)};
function jump(){
  var s=+$('jsurah').value, a=+$('jayah').value||1, mx=SMAX[s]||1;
  a=Math.max(1,Math.min(mx,a));
  var ws=AYW[s+':'+a]; if(ws&&ws.length) showWord(ws[0].i,{flash:true});
}
$('jgo').onclick=jump;
$('jayah').addEventListener('keydown',function(e){if(e.key==='Enter')jump()});
var qt;$('q').addEventListener('input',function(){clearTimeout(qt);var v=this.value;qt=setTimeout(function(){doSearch(v)},250)});
$('qnext').onclick=function(){stepHit(1)}; $('qprev').onclick=function(){stepHit(-1)};
$('m-ed').onclick=function(){state.mode='ed';this.setAttribute('aria-pressed','true');$('m-or').setAttribute('aria-pressed','false');onEdits()};
$('m-or').onclick=function(){state.mode='or';this.setAttribute('aria-pressed','true');$('m-ed').setAttribute('aria-pressed','false');onEdits()};
$('edtog').onclick=function(){setEditMode(!state.editMode)};

function setPM(m){
  document.documentElement.setAttribute('data-pm',m);
  $('pm-dk').setAttribute('aria-pressed',String(m==='dk')); $('pm-lt').setAttribute('aria-pressed',String(m==='lt'));
  try{localStorage.setItem('mn-pm',m)}catch(e){}
}
$('pm-dk').onclick=function(){setPM('dk')}; $('pm-lt').onclick=function(){setPM('lt')};
(function(){var m='dk';try{var s=localStorage.getItem('mn-pm');if(s==='lt'||s==='dk')m=s}catch(e){}setPM(m)})();
/* ---------- mulai ---------- */
var start=2;
try{var sv=+localStorage.getItem('mn-page');if(sv>=1&&sv<=PAGES.length)start=sv}catch(e){}
var hm=/^#hal-(\d+)$/.exec(location.hash||''); if(hm) start=Math.max(1,Math.min(PAGES.length,+hm[1]));
state.page=start;
$('jsurah').innerHTML=D.surahs.map(function(s){return '<option value="'+s.no+'">'+s.no+'. '+esc(s.id)+'</option>'}).join('');
$('jsurah').onchange=function(){$('jayah').max=SMAX[+this.value];$('jayah').placeholder='1–'+SMAX[+this.value]};$('jsurah').onchange.call($('jsurah'));
$('sub').textContent='Surah Ar-Raḥmān (55), 78 ayat, '+fmt(TEXTW.length)+' kata di '+PAGES.length+' halaman. Setiap kata diwarnai menurut kedudukan i\'rabnya; ketuk kata untuk melihat penjelasannya.';
rebuild(); renderLegend(); renderPage(); panelEmpty();

(function(){
  if(!(window.claude&&window.claude.use)) return;
  window.claude.use('db').then(function(db){
    if(!db) return;
    state.db=db;
    var sub=function(col,key){db.collection(col).onSnapshot(function(s){var m={};s.docs.forEach(function(d){m[d.id]=d.data()});state[key]=m;
      if(Object.keys(state.edits).length||Object.keys(state.wed).length) $('modeseg').hidden=false;
      onEdits()},function(){})};
    sub('segs','edits'); sub('words','wed'); sub('units','udb');
    return window.claude.use('user').then(function(user){
      if(!user) return;
      return Promise.all([user.id(),user.canEdit(),user.can('data.write')]).then(function(r){
        state.uid=r[0]; state.canWrite=(r[1]===true||r[2]===true);
        if(state.canWrite){$('edtog').hidden=false;$('tab-edit').hidden=false;$('modeseg').hidden=false;onEdits()}
      });
    });
  }).catch(function(){});
})();
})();
</script>
